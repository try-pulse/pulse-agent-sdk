name: Feature request
description: Propose an improvement to the SDK
title: "[Feature]: "
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: What agent-app task is difficult today? Include the current workaround if there is one.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the SDK behavior or API you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include any simpler approach or trade-off you considered.
  - type: markdown
    attributes:
      value: |
        For a change to Pulse's wire contract, link the upstream API specification or documentation. The SDK does not define the wire contract itself.
