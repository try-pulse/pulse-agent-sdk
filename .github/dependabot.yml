version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Majors that change the toolchain need a deliberate migration, not a bot PR.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: js-yaml
        update-types: ["version-update:semver-major"]
      # Types track engines.node (22), not the newest Node release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
