openapi: 3.0.3
info:
  title: Pulse Agent SDK API
  version: 1.0.0
  description: The pulse-api operations and webhook types used by @pulse/agent-sdk.
servers:
  - url: https://api.trypulse.tech/api/v1
security:
  - BearerAuth: []
paths:
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user profile
      description: >-
        Get the current authenticated user's profile information. An identity route: it needs no OAuth scope and answers
        for any valid token, including an agent app token, where it returns `user.user_kind: application`,
        `user.agent_kind: app`, `app{id, name}` and `installation_id`. Agent apps use it the way Linear agents use
        `viewer`.
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /oauth/authorize:
    get:
      tags:
        - OAuth
        - Authentication
      summary: OAuth2 authorization redirect
      description: >
        Starts the authorization code flow. Validates `client_id`, `redirect_uri`, and `scope`, then returns

        HTTP 302 to the configured login/consent UX. When the caller supplies a Bearer access token compatible with
        Pulse auth,

        a logged-in user may skip redundant login screens.


        PKCE with `S256` is required for every client: a request without `code_challenge`, or with any other

        `code_challenge_method`, is refused with `invalid_request`.


        **Installing an agent app (`actor=app`).** An agent app's client sends `actor=app` to be installed into a

        workspace rather than to act for the person consenting. The consent screen is then admin-only: the person

        must be an owner or admin of the app's developer workspace (the only workspace a v1 private app installs

        into) and chooses the teams the app covers. The grant belongs to the app's own application user, and the

        tokens act as the app (see `POST /oauth/token`). Refusals redirect to `redirect_uri` with:

        - `error=unsupported_actor`: `actor=app` from a client that is not an agent app.

        - `error=invalid_scope`: `admin` was requested with `actor=app`, or an `app:*` scope without `actor=app`.
      operationId: oauthAuthorize
      security: []
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            example: code
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          description: >-
            Scopes separated by spaces or commas (see `OAuthScope`). Agent apps usually request
            `read,write,app:assignable,app:mentionable`.
          schema:
            type: string
            example: read,write,app:assignable,app:mentionable
        - name: state
          in: query
          schema:
            type: string
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            enum:
              - S256
        - name: actor
          in: query
          required: false
          description: >-
            `user` (default): the token acts for the person who consents. `app`: install an agent app; the token acts as
            the app itself.
          schema:
            type: string
            enum:
              - user
              - app
            default: user
      responses:
        '302':
          description: >-
            Redirect to login, consent UI, or `redirect_uri` with `code` or `error` (`invalid_request`, `invalid_scope`,
            `unsupported_actor`, `access_denied`).
        '400':
          description: >-
            OAuth error before a redirect is possible (`invalid_client`, `invalid_request` for an unregistered
            `redirect_uri`, …)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /oauth/token:
    post:
      tags:
        - OAuth
      summary: OAuth2 token endpoint
      description: |
        Issues access and refresh tokens (authorization_code and refresh_token grants). The body is
        form-encoded. A confidential client authenticates with HTTP Basic (`client_secret_basic`) or with
        `client_id` and `client_secret` in the form body (`client_secret_post`); the discovery document at
        `https://api.trypulse.tech/.well-known/oauth-authorization-server` lists both.

        Refresh tokens rotate: every refresh returns a new `refresh_token` and the old one stops working after a
        short grace period.

        **Agent app tokens.** For a grant made with `actor=app`, the tokens act as the app's application user in
        the installation's workspace, limited to the teams the installation covers and to the granted scopes.
        The access token lasts 3600 seconds (`OAUTH_APP_ACCESS_TOKEN_DURATION`). The response adds `actor`,
        `installation_id`, `app_user_id` and `workspace_id`; store the tokens per `installation_id`. After the app
        is uninstalled, a refresh answers `invalid_grant` and access tokens get `401 INSTALLATION_REVOKED`.
        App tokens are refused by `POST /auth/refresh` and by every session-only route (`SESSION_ONLY_ROUTE`).
      operationId: oauthToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - grant_type
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                client_id:
                  type: string
                  description: Required unless the client authenticates with HTTP Basic.
                client_secret:
                  type: string
                  description: '`client_secret_post`. Omit when sending HTTP Basic credentials.'
                code:
                  type: string
                  description: Authorization code (authorization_code grant)
                redirect_uri:
                  type: string
                code_verifier:
                  type: string
                  description: PKCE verifier
                refresh_token:
                  type: string
                  description: Existing refresh token (refresh_token grant)
      responses:
        '200':
          description: Token response (OAuth2-style)
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - token_type
                  - expires_in
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: integer
                    description: Seconds. 3600 for agent app tokens.
                    example: 3600
                  refresh_token:
                    type: string
                    description: Rotates on every refresh.
                  scope:
                    type: string
                    description: The granted scopes, space-separated.
                    example: read write app:assignable app:mentionable
                  actor:
                    type: string
                    enum:
                      - user
                      - app
                    description: '`app` for an agent app installation.'
                  installation_id:
                    type: string
                    description: Agent app tokens only. The installation this token belongs to.
                  app_user_id:
                    type: string
                    description: Agent app tokens only. The app's user id in the workspace.
                  workspace_id:
                    type: string
                    description: Agent app tokens only. Send it as `X-Workspace-ID` on every call.
              example:
                access_token: eyJhbGciOi...
                token_type: Bearer
                expires_in: 3600
                refresh_token: prt_4f1c...
                scope: read write app:assignable app:mentionable
                actor: app
                installation_id: 6ab5a2d134765b14d76a6b10
                app_user_id: 6ab5a2d134765b14d76a6b12
                workspace_id: 6a34cfb024a3b4ed28806e3b
        '400':
          description: OAuth error envelope (`invalid_grant`, `invalid_client`, `invalid_request`, …)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /oauth/revoke:
    post:
      tags:
        - OAuth
      summary: Revoke OAuth token (RFC7009 subset)
      description: Best-effort token revocation — always responds 200.
      operationId: oauthRevoke
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                token:
                  type: string
                token_type_hint:
                  type: string
      responses:
        '200':
          description: Revoked (or silently ignored invalid token).
  /issues/{id}:
    get:
      tags:
        - Issues
      summary: Get issue by ID
      description: >
        Get a specific issue by ID with full enriched data including linked request and its key results.


        **Enrichment**: Includes parent issue info (for sub-issues) and progress tracking (for parent issues with
        sub-tasks).
      operationId: getIssueById
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Issue details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Issues
      summary: Update issue
      description: >
        Update issue with partial updates including the ability to link/unlink requests.


        **Progress updates**: When updating a sub-task's status, the parent issue's progress is automatically
        recalculated via the event system (eventually consistent, ~50-200ms delay).


        **Agent app tokens**: `status` may only change to `in_progress` or `qa` (otherwise

        `403 APP_STATUS_FORBIDDEN`), and `delegate_id` may not be set, changed or cleared

        (`400 INVALID_DELEGATE`, reason `app_actor`). Needs `write`.
      operationId: updateIssue
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateIssueRequest'
      responses:
        '200':
          description: Issue updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
        '400':
          $ref: '#/components/responses/IssueWriteBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/IssueWriteForbidden'
        '404':
          description: The issue does not exist, or a label in `label_ids` does not exist (`LABEL_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            `label_ids` cannot be applied (`VALIDATION`): more than 10 labels, a repeated
            label, a label from another team, a label for a different entity type, or an
            archived label.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    AgentAppScope:
      type: string
      description: The scopes an agent app manifest may request. `admin` is not one of them.
      enum:
        - read
        - write
        - issues:create
        - comments:create
        - app:assignable
        - app:mentionable
    AgentSessionComment:
      type: object
      description: A comment of the session's thread before the session started, oldest first.
      required:
        - id
        - body
        - author
        - created_at
      properties:
        id:
          type: string
        body:
          type: string
          description: Markdown.
        author:
          $ref: '#/components/schemas/AgentSessionPerson'
        created_at:
          type: string
          format: date-time
    AgentSessionEventCreatedData:
      type: object
      description: |
        `AgentSessionEvent` / `created`. Answer the webhook within 5 seconds, then post a
        first activity (or set an external URL) within 10 seconds, or the session shows
        as unresponsive.

        `prompt_context` is XML using Linear's tags (see the Agent Session API docs): an
        `<issue identifier url>` with `<title>`, `<description>`, `<team>`, `<label>`,
        `<project>` and `<parent-issue>`; `<primary-directive-thread comment-id>` and
        `<other-thread comment-id>` holding `<comment author created-at>`; `<guidance>` with
        `<guidance-rule origin="workspace">` then `<guidance-rule origin="team" team="KEY">`;
        and `<repository-hint repository="group/project"/>` from the issue team's routing
        hints. At most 64 KB: the oldest `<other-thread>` blocks go first, then the
        description is truncated.
      required:
        - event_id
        - agent_session
        - previous_comments
        - guidance
        - prompt_context
      properties:
        event_id:
          type: string
          description: Stable across retries. Deduplicate on it.
          example: ase_6ab5b0114f48187cbd3ce9a1_created
        agent_session:
          $ref: '#/components/schemas/AgentSession'
        previous_comments:
          type: array
          items:
            $ref: '#/components/schemas/AgentSessionComment'
        guidance:
          type: array
          items:
            $ref: '#/components/schemas/AgentSessionGuidance'
        prompt_context:
          type: string
          maxLength: 65536
    AgentSessionEventPromptedData:
      type: object
      description: '`AgentSessionEvent` / `prompted`.'
      required:
        - event_id
        - agent_session
        - agent_activity
      properties:
        event_id:
          type: string
          example: ase_6ab5b0114f48187cbd3ce9a1_act_9
        agent_session:
          $ref: '#/components/schemas/AgentSession'
        agent_activity:
          $ref: '#/components/schemas/PromptedActivity'
    AgentSessionGuidance:
      type: object
      description: >-
        One guidance rule sent to the app: the workspace's, then the issue team's. The team rule wins on conflict.
        Global platform guidance and personal guidance are never sent.
      required:
        - origin
        - body
      properties:
        origin:
          type: string
          enum:
            - workspace
            - team
        team_id:
          type: string
          description: Present when `origin` is `team`.
        body:
          type: string
          description: Markdown.
    AppWebhookAction:
      type: string
      description: |
        - `AgentSessionEvent`: `created` (a session was opened for the app) or `prompted`
          (a human wrote in the session, or pressed Stop).
        - `PermissionChange`: `teamAccessChanged`.
        - `OAuthApp`: `revoked` (the app was uninstalled).
        - `Issue`, `Comment`, `Project`: `create`, `update`, `remove`.
        - `Ping`: `create`.
      enum:
        - created
        - prompted
        - teamAccessChanged
        - revoked
        - create
        - update
        - remove
    AppWebhookEnvelope:
      type: object
      description: |
        The JSON body of every app webhook delivery: the workspace webhook envelope v1 plus
        `installation_id` and `app_user_id`. `actor` is the human who delegated, mentioned
        or prompted for `AgentSessionEvent`, and `system` for `PermissionChange` and
        `OAuthApp`.

        `Ping` is the one exception: `POST /agent-apps/{app_id}/webhook/test` sends it for
        the app itself, not for an installation, so it has no `installation_id` and no
        `app_user_id` (both keys are absent), `workspace_id` is the app's developer
        workspace, `actor` is the admin who sent the test, `url` is empty and `data` is
        `AppWebhookPingData`. Every other `type` always carries both ids.

        Delivery headers:
        - `Content-Type: application/json; charset=utf-8`
        - `User-Agent: Pulse-Webhook/1`
        - `Pulse-Delivery`: stable per webhook and event, the same on every retry
        - `Pulse-Event`: the envelope `type`, e.g. `AgentSessionEvent`
        - `Pulse-Signature`: lowercase hex HMAC-SHA256 of the raw body with the webhook
          secret (`pwhsec_…`), no `sha256=` prefix
        - `Pulse-Timestamp`: Unix milliseconds of this attempt. **Not signed** — check the
          body's `webhook_timestamp` instead.

        The receiver answers any 2xx within 5 seconds; redirects are not followed. Failed
        attempts retry after 1 minute, 1 hour and 6 hours (4 attempts); a webhook with no
        success and at least 3 failures in 24 hours is disabled. Verify the signature over
        the raw body, then reject a `webhook_timestamp` more than 60 seconds from your
        clock, then deduplicate on `data.event_id` (a `Ping` has none and is never retried).
      required:
        - action
        - type
        - actor
        - created_at
        - data
        - url
        - workspace_id
        - webhook_id
        - webhook_timestamp
      properties:
        action:
          $ref: '#/components/schemas/AppWebhookAction'
        type:
          $ref: '#/components/schemas/AppWebhookEventType'
        actor:
          $ref: '#/components/schemas/WebhookActor'
        created_at:
          type: string
          format: date-time
          description: When the event happened (UTC, three fractional digits). Identical on every retry.
          example: '2026-09-25T09:12:03.120Z'
        data:
          oneOf:
            - $ref: '#/components/schemas/AgentSessionEventCreatedData'
            - $ref: '#/components/schemas/AgentSessionEventPromptedData'
            - $ref: '#/components/schemas/PermissionChangeData'
            - $ref: '#/components/schemas/OAuthAppRevokedData'
            - $ref: '#/components/schemas/WebhookIssueData'
            - $ref: '#/components/schemas/WebhookCommentData'
            - $ref: '#/components/schemas/WebhookProjectData'
            - $ref: '#/components/schemas/AppWebhookPingData'
        updated_from:
          type: object
          additionalProperties: true
          description: '`Issue` and `Project` `update` only, as for workspace webhooks.'
        url:
          type: string
          description: The issue, comment or session in the Pulse app. Empty when it could not be built, and always for `Ping`.
          example: https://app.trypulse.tech/pulse/issues/6ab5b0024f48187cbd3ce990
        workspace_id:
          type: string
          description: The workspace the app is installed in; for `Ping`, the app's developer workspace.
        webhook_id:
          type: string
          description: The app's webhook.
        webhook_timestamp:
          type: integer
          format: int64
          description: >-
            Unix milliseconds of this attempt. Covered by the signature, unlike the `Pulse-Timestamp` header; check it
            is within ±60 seconds. Changes on every retry.
          example: 1790327523120
        installation_id:
          type: string
          description: The installation the event belongs to. Key your token store on it. Present on every `type` except `Ping`.
        app_user_id:
          type: string
          description: The app's user id in this workspace. Present on every `type` except `Ping`.
    AppWebhookEventType:
      type: string
      description: |
        The envelope `type`, also sent as `Pulse-Event`.

        - Always delivered: `AgentSessionEvent`, `PermissionChange`, `OAuthApp`.
        - Opt-in through the manifest `webhook.resource_types`, filtered to the
          installation's teams: `Issue`, `Comment`, `Project` (same data shapes as
          workspace webhooks).
        - `Ping`: only sent by `POST /agent-apps/{app_id}/webhook/test`.
      enum:
        - AgentSessionEvent
        - PermissionChange
        - OAuthApp
        - Issue
        - Comment
        - Project
        - Ping
    AppWebhookPingData:
      type: object
      description: >-
        `Ping` / `create`, sent only by `POST /agent-apps/{app_id}/webhook/test`. The same `data` as a workspace webhook
        `Ping`; an app webhook has no label of its own, so `label` is the app's name. It has no `event_id`: a test is
        sent once and never retried.
      required:
        - webhook_id
        - label
      properties:
        webhook_id:
          type: string
          description: The app's webhook, as in the envelope.
        label:
          type: string
          description: The app's name.
          example: Scout
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code
          example: INVALID_REQUEST
        message:
          type: string
          description: Human-readable error message
          example: Invalid request format
        details:
          type: object
          description: Additional error details
          additionalProperties: true
        conflict:
          allOf:
            - $ref: '#/components/schemas/Conflict'
          description: >-
            Present only on the small set of 409 responses that need to identify the conflicting resource, not just
            describe it in `message` (e.g. a duplicate `external_reference` or an already-resolved request). Omitted on
            every other error response, including most 409s.
    Issue:
      allOf:
        - $ref: '#/components/schemas/IssueBasic'
        - type: object
          required:
            - team_id
            - reporter_id
            - created_at
            - updated_at
          properties:
            team_id:
              $ref: '#/components/schemas/ObjectId'
            project_id:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
                - nullable: true
            milestone_id:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
                - nullable: true
              description: ID of the milestone this issue belongs to. Must belong to the same project as the issue.
            cycle_id:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
                - nullable: true
            request_ids:
              type: array
              items:
                $ref: '#/components/schemas/ObjectId'
              description: IDs of requests (bug reports/feature requests) that spawned this issue.
            reporter_id:
              $ref: '#/components/schemas/ObjectId'
            assignee_id:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
                - nullable: true
              description: The human who owns the issue. Never an agent.
            delegate_id:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
                - nullable: true
              description: >-
                The agent executing the issue. An agent a user created may be named here only by its owner; the
                deployment agent may be named by anyone with access to the issue.
            delegated_by:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
                - nullable: true
              description: >-
                The person the current delegated run is authorised as — whoever set this delegate, which is not
                necessarily the assignee. It belongs to the current `delegation_revision` and is cleared with the
                delegate. Absent on issues delegated before this field existed.
            delegated_via_agent_id:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
                - nullable: true
              description: >-
                Set when an orchestrator agent made the current delegation under an orchestration grant: the
                orchestrator. `delegated_by` is still the person who granted it. Cleared with the delegate, and by any
                delegation a person makes.
            delegation_grant_id:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
                - nullable: true
              description: >-
                The orchestration grant the current delegation was made under. Also an issue list filter
                (`delegation_grant_id`, `eq`/`in`).
            delegation_revision:
              type: integer
              format: int64
              minimum: 0
              example: 2
              description: >-
                Incremented on every delegate set, change or removal, and never on a write that leaves the delegate
                unchanged. 0 for an issue that has never been delegated.
            parent_id:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
                - nullable: true
            time_estimate:
              type: integer
              minimum: 1
              maximum: 1000
              nullable: true
              example: 16
              description: Time estimate, in the owning team's estimate scale
            due_date:
              allOf:
                - $ref: '#/components/schemas/DateTime'
                - nullable: true
            completed_at:
              allOf:
                - $ref: '#/components/schemas/DateTime'
                - nullable: true
            blocks_ids:
              type: array
              items:
                $ref: '#/components/schemas/ObjectId'
            blocked_by_ids:
              type: array
              items:
                $ref: '#/components/schemas/ObjectId'
            labels:
              type: array
              items:
                $ref: '#/components/schemas/CatalogLabel'
            main_doc_id:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
                - nullable: true
            progress:
              allOf:
                - $ref: '#/components/schemas/IssueProgress'
                - nullable: true
              description: Progress tracking for parent issues with sub-tasks. Only present when the issue has sub-tasks.
            development_summary:
              allOf:
                - $ref: '#/components/schemas/IssueDevelopmentSummary'
                - nullable: true
              description: >-
                Returned by the issue list endpoints, and only when the issue has active development links. The
                single-issue endpoint (GET /issues/{id}) always omits it, so absence here never means "this issue has no
                links" — read GET /issues/{id}/development-links for that.
            team:
              $ref: '#/components/schemas/TeamBasic'
            project:
              allOf:
                - type: object
                  properties:
                    id:
                      $ref: '#/components/schemas/ObjectId'
                    title:
                      type: string
                      example: User Management System
                    status:
                      $ref: '#/components/schemas/ProjectStatus'
                - nullable: true
            cycle:
              allOf:
                - type: object
                  properties:
                    id:
                      $ref: '#/components/schemas/ObjectId'
                    name:
                      type: string
                      example: Sprint 1
                    status:
                      type: string
                      enum:
                        - planned
                        - active
                        - completed
                - nullable: true
            milestone:
              allOf:
                - $ref: '#/components/schemas/Milestone'
                - nullable: true
              description: Enriched milestone object. Present when milestone_id is set.
            requests:
              type: array
              items:
                $ref: '#/components/schemas/Request'
              description: Enriched request data for all linked requests.
            reporter:
              $ref: '#/components/schemas/UserBasic'
            assignee:
              allOf:
                - $ref: '#/components/schemas/UserBasic'
                - nullable: true
            delegate:
              allOf:
                - $ref: '#/components/schemas/UserBasic'
                - nullable: true
              description: Enriched delegate agent. Present when delegate_id is set.
            delegated_via_agent:
              allOf:
                - $ref: '#/components/schemas/UserBasic'
                - nullable: true
              description: Enriched orchestrator agent. Present when delegated_via_agent_id is set.
            parent:
              allOf:
                - $ref: '#/components/schemas/IssueBasic'
                - nullable: true
            children:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/IssueBasic'
                  - type: object
                    properties:
                      assignee:
                        allOf:
                          - $ref: '#/components/schemas/UserBasic'
                          - nullable: true
            blocks:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/IssueBasic'
                  - type: object
                    properties:
                      assignee:
                        allOf:
                          - $ref: '#/components/schemas/UserBasic'
                          - nullable: true
            blocked_by:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/IssueBasic'
                  - type: object
                    properties:
                      assignee:
                        allOf:
                          - $ref: '#/components/schemas/UserBasic'
                          - nullable: true
            content:
              type: array
              items:
                $ref: '#/components/schemas/ContentBasic'
            releases:
              type: array
              items:
                $ref: '#/components/schemas/ReleaseResponse'
              description: Enriched release objects linked to this issue.
            main_doc:
              allOf:
                - $ref: '#/components/schemas/ContentBasic'
                - nullable: true
            grant_info:
              allOf:
                - $ref: '#/components/schemas/GrantInfo'
                - nullable: true
                - description: >-
                    Present when the requesting user accessed this issue via an explicit share grant. Absent for team
                    members accessing via normal team permissions.
            sla:
              allOf:
                - $ref: '#/components/schemas/SLASummaryResponse'
                - nullable: true
                - description: >-
                    Present when the issue has an active SLA assignment. Absent when SLA is disabled for the workspace
                    or no rule matched.
            agent_session:
              allOf:
                - $ref: '#/components/schemas/IssueAgentSessionResponse'
                - description: >-
                    The issue's CURRENT delegated agent run. Absent — never null, never an empty object — when the issue
                    was never delegated, its agent was removed, or the current delegation revision runs nothing.
            time_in_status:
              allOf:
                - $ref: '#/components/schemas/IssueTimeInStatus'
                - nullable: true
                - description: Same shape on list and detail reads. Absent when timing data is unavailable; never fails the read.
            is_subscribed:
              type: boolean
              description: >
                True when the current user has an explicit `subscribed` row. Absence of a row does not guarantee
                silence—implicit/auto subscribers may still receive notifications until they unsubscribe. See
                `SubscriptionMeta` in subscription.yaml.
            subscriber_count:
              type: integer
              minimum: 0
              description: Count of explicit `subscribed` rows for this issue (not implicit recipients).
            created_at:
              $ref: '#/components/schemas/DateTime'
            updated_at:
              $ref: '#/components/schemas/DateTime'
    IssueStatus:
      type: string
      enum:
        - backlog
        - todo
        - in_progress
        - qa
        - release
        - done
      description: Issue status
    MeResponse:
      type: object
      description: >-
        The caller's own identity. Needs no OAuth scope, and answers for any valid agent app token. For an agent app
        token, `user.user_kind` is `application`, `user.agent_kind` is `app`, and `app` and `installation_id` are set.
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/UserBasic'
        app:
          type: object
          description: Agent app tokens only. The app the token belongs to.
          required:
            - id
            - name
          properties:
            id:
              type: string
              example: 6ab5a1c04f48187cbd3ce901
            name:
              type: string
              example: Scout
        installation_id:
          type: string
          description: Agent app tokens only. The installation the token belongs to.
          example: 6ab5a2d134765b14d76a6b10
        default_home_view:
          description: >-
            The caller's resolved default home view for the scoped workspace. Omitted if it could not be resolved. Both
            the user and workspace tiers are stored per workspace, so this resolves to the global default (`source:
            global`, `user` and `workspace` both null) unless the request pins one workspace — send `X-Workspace-ID` to
            get the caller's real default. A request without that header resolves to a workspace only when the caller
            belongs to exactly one.
          allOf:
            - $ref: '#/components/schemas/HomeViewResponse'
        preferences:
          description: >-
            The caller's preference documents, exactly as `GET /me/preferences` returns them: the `user` scope always,
            and the `workspace` scope when the request pins a workspace via `X-Workspace-ID` (null otherwise). Omitted
            if they could not be loaded. Embedded so a client boots with its preferences at no extra request.
          allOf:
            - $ref: '#/components/schemas/PreferencesResponse'
    OAuthAppRevokedData:
      type: object
      description: >-
        `OAuthApp` / `revoked`. The app was uninstalled: its tokens stop working, its delegations are released and its
        sessions end with `end_reason: uninstalled`. Delivered even though the installation is no longer active. Drop
        the stored tokens.
      required:
        - event_id
        - installation_id
        - app_id
      properties:
        event_id:
          type: string
        installation_id:
          type: string
        app_id:
          type: string
    OAuthError:
      type: object
      description: >-
        RFC 6749 error shape used by the OAuth endpoints. `insufficient_scope` never appears here; it is sent only in
        `WWW-Authenticate` on a `403 INSUFFICIENT_SCOPE` from an API route.
      required:
        - error
      properties:
        error:
          type: string
          description: >-
            `invalid_request`, `invalid_client`, `invalid_grant`, `invalid_scope`, `unauthorized_client`,
            `unsupported_grant_type`, `access_denied`, or `unsupported_actor` (`actor=app` from a client that is not an
            agent app).
          example: unsupported_actor
        error_description:
          type: string
    OAuthScope:
      type: string
      description: |
        A scope an OAuth client may request. A scope string separates scopes with spaces
        or commas (`read,write,app:assignable` and `read write app:assignable` are equal).

        - `read`: read what the token's user can read. A grant with an empty scope is `read`.
        - `write`: create, change and delete. Implies `issues:create` and `comments:create`.
        - `issues:create`: `POST /issues` only.
        - `comments:create`: create comments and replies only.
        - `app:assignable`: agent apps only. The app can be delegated issues.
        - `app:mentionable`: agent apps only. The app can be @mentioned in comments.
        - `openid`, `profile`, `offline_access`: legacy identity scopes; they grant no data access.
        - `mcp:read`, `mcp:write`: legacy; read as `read` and `write`.

        `app:*` is accepted only with `actor=app` from a client that is an agent app.
        `admin` is never granted to an agent app. Identity routes (`GET /auth/me`,
        `GET /workspaces/me`, `GET /teams/select`) need no scope.
      enum:
        - read
        - write
        - issues:create
        - comments:create
        - app:assignable
        - app:mentionable
        - openid
        - profile
        - offline_access
        - mcp:read
        - mcp:write
      example: app:assignable
    PermissionChangeData:
      type: object
      description: >-
        `PermissionChange` / `teamAccessChanged`. An admin changed which teams the installation covers. Sessions on
        removed teams end with `end_reason: team_removed`.
      required:
        - event_id
        - installation_id
        - all_teams
        - team_ids
        - added_team_ids
        - removed_team_ids
      properties:
        event_id:
          type: string
        installation_id:
          type: string
        all_teams:
          type: boolean
        team_ids:
          type: array
          items:
            type: string
          description: The covered teams now. Empty when `all_teams` is true.
        added_team_ids:
          type: array
          items:
            type: string
        removed_team_ids:
          type: array
          items:
            type: string
    PromptedActivity:
      type: object
      description: >-
        The human's message. `signal: stop` means the human pressed Stop: do nothing further and post a final `response`
        or `error`. For an answer to a `select` elicitation, `content.body` is the chosen option's `value`, or free
        text.
      required:
        - id
        - content
        - author
        - created_at
      properties:
        id:
          type: string
        content:
          type: object
          required:
            - type
            - body
          properties:
            type:
              type: string
              enum:
                - prompt
            body:
              type: string
              description: Markdown.
        signal:
          type: string
          enum:
            - stop
        author:
          $ref: '#/components/schemas/AgentSessionPerson'
        created_at:
          type: string
          format: date-time
    UpdateIssueRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
          example: Fix user registration validation - Updated
        description:
          type: string
          maxLength: 500
          example: Updated description with more details
        status:
          $ref: '#/components/schemas/IssueStatus'
        priority:
          $ref: '#/components/schemas/IssuePriority'
        project_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
            - nullable: true
          description: |
            Link or unlink a project. Set to `null` (or `""`) to unlink; omit to leave unchanged.
            Unlinking or changing the project also clears `milestone_id`.
            Rejected on a sub-issue, and on an issue that `parent_id` makes one in the same
            request: a sub-issue's project is its parent's. Unlinking is rejected for the same
            reason as linking. Sending `parent_id: null` in the same request lifts that, since
            what remains is a top-level issue.
        assignee_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
            - nullable: true
          description: |
            Assign or unassign the issue. Set to `null` to unassign; omit to leave unchanged.
            Must be a person. Unassigning a delegated issue requires clearing `delegate_id`
            in the same request (DELEGATION_REQUIRES_ASSIGNEE).
        delegate_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
            - nullable: true
          description: |
            Delegate the issue to an agent, replace its agent, or set to `null` to remove
            the agent; omit to leave unchanged. The human assignee is never changed, except
            that delegating an unassigned issue assigns the caller; a caller who could not be
            assigned (an agent, or a person outside the issue's team) gets
            DELEGATION_REQUIRES_ASSIGNEE and must set `assignee_id` to a team member in the
            same request. Compared and stored lowercased, so the same agent in another case
            is not a change. Must be an active agent
            with access to the issue's team; personal issues cannot be delegated. A refusal
            answers 400 `INVALID_DELEGATE` with `details.reason` (see InvalidDelegateDetails).
            An agent app delegate also needs an active installation covering the issue's team,
            `app:assignable` and an enabled webhook. An agent app token may not set, change or
            clear this field (`app_actor`); undelegating an app ends its session with
            `end_reason: undelegated`.
        time_estimate:
          allOf:
            - type: integer
              minimum: 0
              maximum: 1000
            - nullable: true
          description: |
            Set the issue's estimate. When the team has estimates enabled, the value must be one
            of the team's scale values (0 only if the team allows zero). Set to `null` to clear
            the estimate; omit to leave unchanged.
          example: 8
        due_date:
          $ref: '#/components/schemas/DateTime'
        label_ids:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ObjectId'
        milestone_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
            - nullable: true
          description: |
            Link or unlink a milestone. The milestone must belong to the same project as the issue.
            Set to `null` to unlink. Removing the issue's project also clears this field automatically.
            Rejected on a sub-issue, and on an issue that `parent_id` makes one in the same request,
            under the same rule as `project_id`.
        cycle_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
            - nullable: true
          description: |
            Link or unlink a cycle. The cycle must belong to the same team as the issue.
            Set to `null` to unlink. Omit to leave unchanged.
            Rejected on a sub-issue, and on an issue that `parent_id` makes one in the same request,
            under the same rule as `project_id`.
        request_ids:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
          description: Full replacement of linked request IDs. Omit to leave unchanged; send an empty array to unlink all.
        parent_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
            - nullable: true
          description: |
            Link or unlink a parent issue (convert to/from sub-issue).
            Set to `null` to detach from the parent. Omit to leave unchanged.
            Attaching a parent overwrites `project_id`, `milestone_id` and `cycle_id` with the
            parent's values, clearing each one the parent does not have; the sub-issue's own
            sub-tasks then follow whenever the parent changes any of the three. Detaching leaves
            the inherited values in place — send them in the same request to change them.
        release_ids:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
          maxItems: 20
          description: IDs of releases to link. Sub-issues may link to releases independently of their parent.
          example:
            - 507f1f77bcf86cd799439011
    WebhookActor:
      type: object
      nullable: true
      description: >
        Who made the change. Null when the user no longer exists or the event has no actor. `system` is a write no
