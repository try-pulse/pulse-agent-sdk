    InvalidDelegateDetails:
      type: object
      description: |
        `details` of a 400 `INVALID_DELEGATE` response. `message` is localized; `reason` is
        stable in every locale, so clients key their own copy on it. A create an
        orchestrator agent makes outside its orchestration grant with no delegate
        involved answers 400 `ORCHESTRATION_GRANT_REFUSED` with the same details.
      required:
        - reason
      properties:
        reason:
          type: string
          enum:
            - not_agent
            - not_found
            - not_active
            - no_team_access
            - personal_issue
            - agent_actor
            - outside_grant_scope
            - delegate_not_in_grant
            - self_delegation
            - not_grant_delegation
            - grant_limit_reached
            - app_actor
            - app_not_installed_for_team
            - app_missing_scope
            - app_webhook_disabled
          description: |
            - `not_agent`: the delegate is not an agent.
            - `not_found`: the agent has no user record.
            - `not_active`: the agent is not active.
            - `no_team_access`: the agent has no access to the issue's team.
            - `personal_issue`: personal issues cannot be delegated.
            - `agent_actor`: the write was made by an agent (a delegated agent token, or an
              agent authenticated as itself) that holds no live orchestration grant for it;
              outside a grant only a person may set, change or clear a delegate.
            - `outside_grant_scope`: an orchestrator's write under its grant targets an issue
              outside the grant's project or milestone, the grant's anchor, or a personal issue.
            - `delegate_not_in_grant`: the delegate is not one of the grant's workers.
            - `self_delegation`: an orchestrator named itself.
            - `not_grant_delegation`: the delegation being changed or cleared was not made
              under this grant (a person's delegation is never the orchestrator's to change).
            - `grant_limit_reached`: a cap of the grant is used up; `limit` names it.
            - `app_actor`: the write was made by an agent app token. Agent apps cannot set,
              change or clear a delegate — not even their own.
            - `app_not_installed_for_team`: the delegate is an agent app whose active
              installation does not cover the issue's team.
            - `app_missing_scope`: the delegate is an agent app installed without
              `app:assignable`.
            - `app_webhook_disabled`: the delegate is an agent app whose webhook is disabled,
              so it could not receive the session.
          example: no_team_access
        limit:
          type: string
          enum:
            - delegated_issues
            - delegation_writes
            - issues_created
          description: Set with `grant_limit_reached`.
    ObjectId:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      description: MongoDB ObjectID
      example: 60f7b3b3b3b3b3b3b3b3b3b3
    WebhookTimestamp:
      type: string
      format: date-time
      description: A UTC instant with exactly three fractional digits.
      example: '2026-09-17T10:00:00.000Z'
    DateTime:
      type: string
      format: date-time
      description: ISO 8601 date-time
      example: '2024-01-15T10:30:00Z'
    IssuePriority:
      type: string
      enum:
        - no_priority
        - urgent
        - high
        - medium
        - low
      description: Issue priority level
    AgentSessionPerson:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
          example: Sara Ahmadi
    PreferencesResponse:
      type: object
      description: Both scopes in one read.
      properties:
        user:
          $ref: '#/components/schemas/PreferencesDocument'
        workspace:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PreferencesDocument'
          description: Null when the request resolves no workspace.
      required:
        - user
        - workspace
    PreferencesDocument:
      type: object
      description: |
        One scope's complete document. A person with nothing stored receives the
        empty default (`persisted: false`, `rev: 0`, no values), so a client never
        has to merge the response with anything. Keys are opaque to the server: the
        client registry owns what a key means, its schema and its default.
      properties:
        scope:
          $ref: '#/components/schemas/PreferenceScope'
        version:
          type: integer
          description: Shape of the stored document. Currently always `1`.
        rev:
          type: integer
          format: int64
          description: Incremented by one on every write to this scope. `0` until the first write.
        persisted:
          type: boolean
          description: |
            False when nothing is stored and this is the empty default. A client runs
            its one-time import of local state only while this is false.
        values:
          type: object
          description: |
            Per-key entries. Keys are 1-64 characters matching
            `^[a-z0-9][a-z0-9._-]{0,63}$`; the stored document holds at most 256 of
            them and at most 256 KiB of keys plus values.
          maxProperties: 256
          additionalProperties:
            $ref: '#/components/schemas/PreferenceEntry'
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: Null while `persisted` is false.
      required:
        - scope
        - version
        - rev
        - persisted
        - values
    PreferenceEntry:
      type: object
      description: One stored value with the moment and the client that last wrote it.
      properties:
        v:
          description: >-
            The client's JSON value, returned semantically identical to what was written (whitespace removed). At most 8
            KiB.
        at:
          type: string
          format: date-time
          description: Server time of the last write to this key. Newest wins per key across devices.
        by:
          $ref: '#/components/schemas/PreferencePlatform'
      required:
        - v
        - at
    PreferencePlatform:
      type: string
      description: The client that wrote an entry. Recorded per key, never interpreted by the server.
      enum:
        - web
        - pwa
        - macos
        - ios
    PreferenceScope:
      type: string
      description: |
        Which document a write lands in. `user` follows the account to every
        workspace, device and client; `workspace` is one account inside the
        workspace pinned by `X-Workspace-ID`.
      enum:
        - user
        - workspace
    HomeViewResponse:
      type: object
      description: |
        The resolved default home view plus the raw per-tier values. `effective` is
        resolved as user override, then workspace default, then the global constant
        (`my_issues`).
      properties:
        effective:
          $ref: '#/components/schemas/HomeViewSelection'
        source:
          type: string
          enum:
            - user
            - workspace
            - global
        user:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/HomeViewSelection'
          description: The raw user override, or null when unset.
        workspace:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/HomeViewSelection'
          description: The raw workspace default, or null when unset.
        global:
          $ref: '#/components/schemas/HomeViewSelection'
    HomeViewSelection:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/HomeViewType'
        favorite_id:
          type: string
          description: Present only when `type` is `favorite`.
      required:
        - type
    HomeViewType:
      type: string
      description: |
        Fixed home-view code. All values are constant except `favorite`, which pairs
        with a `favorite_id` pointing at one of the caller's favorites.
      enum:
        - inbox
        - my_issues
        - all_issues
        - active_issues
        - current_cycle
        - projects
        - initiatives
        - favorite
    UserBasic:
      type: object
      required:
        - id
        - email
        - role
        - status
        - team_memberships
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        email:
          type: string
          format: email
          example: user@example.com
        role:
          type: string
          enum:
            - admin
            - user
          example: user
        status:
          type: string
          enum:
            - active
            - blocked
            - pending
          example: active
        avatar_url:
          type: string
          format: uri
          nullable: true
          description: Public URL to user's avatar image
          example: https://storage.example.com/avatars/user123/1234567890.jpg
        avatar_urls:
          $ref: '#/components/schemas/AvatarURLSet'
        avatar_status:
          type: string
          enum:
            - pending
            - processing
            - processed
          nullable: true
          description: >-
            AI avatar-processing status. Absent/null for users who have never uploaded an avatar. "pending"/"processing"
            mean an AI-enhanced version is being generated in the background — poll this endpoint until it becomes
            "processed", at which point avatar_url reflects the final image (or the original, if generation ultimately
            failed after retries).
          example: processed
        team_memberships:
          type: array
          description: Array of team memberships
          items:
            $ref: '#/components/schemas/TeamMembership'
          example:
            - team_id: 60f7b3b3b3b3b3b3b3b3b3b4
              team_role: manager
        teams:
          type: array
          description: Enriched team data (not persisted, populated on read)
          items:
            $ref: '#/components/schemas/TeamBasic'
          nullable: true
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
        email_verified:
          type: boolean
          description: Soft gate for self-serve registration. Existing (pre-onboarding) users are treated as verified.
          example: true
        email_verified_at:
          $ref: '#/components/schemas/DateTime'
          nullable: true
        onboarding_completed:
          type: boolean
          description: Routing flag — false routes the frontend to /welcome. Existing users are treated as completed.
          example: true
        onboarding_completed_at:
          $ref: '#/components/schemas/DateTime'
          nullable: true
        default_workspace_id:
          type: string
          nullable: true
          description: Set on first self-serve workspace creation.
        user_kind:
          type: string
          enum:
            - human
            - application
          description: >-
            `application` marks an agent account (Pulse Agent, a personal agent or an installed agent app). Always
            present on the wire. Branch on this, never on name or email.
        agent_kind:
          allOf:
            - $ref: '#/components/schemas/AgentKind'
          description: >-
            Present only when `user_kind` is `application`. On an issue's `delegate` it tells a Pulse Agent, a personal
            agent and an installed agent app apart.
    AgentKind:
      type: string
      description: |
        Which kind of agent an application user is. Present on agent accounts only.

        - `deployment`: Pulse Agent, the deployment's own agent.
        - `personal`: an agent a member created for themselves.
        - `app`: an installed agent app.
      enum:
        - deployment
        - personal
        - app
      example: app
    TeamBasic:
      type: object
      required:
        - id
        - name
        - icon_code
        - icon_color
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Development Team
        icon_code:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[a-zA-Z0-9_-]+$
          example: dev-icon
        icon_color:
          $ref: '#/components/schemas/HexColor'
    HexColor:
      type: string
      pattern: ^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$
      description: Hex color code
      example: '#3498db'
    TeamMembership:
      type: object
      required:
        - team_id
        - team_role
      properties:
        team_id:
          $ref: '#/components/schemas/ObjectId'
          description: Team ID
          example: 60f7b3b3b3b3b3b3b3b3b3b4
        team_role:
          type: string
          enum:
            - manager
            - member
            - viewer
            - qa
          description: >-
            Display-only projection of `role_id`: seeded Team Manager reads `manager`, Viewer `viewer`, QA `qa`, every
            other role (including a custom one) `member`. Never an authority signal.
          example: member
        role_id:
          type: string
          description: The workspace_roles row (kind=team) this membership holds.
        role_name:
          type: string
          description: Name of the assigned team role. Empty when the role could not be resolved.
          example: Team Member
    AvatarURLSet:
      type: object
      description: >-
        Resized avatar variants produced on the fly by imgproxy. Each field is a signed URL to a downscaled square
        version of the same avatar; the client picks the size that fits its rendering context. Omitted entirely when
        imgproxy is not configured (in that case use avatar_url).
      properties:
        xs:
          type: string
          format: uri
          description: 32×32 variant
        s:
          type: string
          format: uri
          description: 64×64 variant
        m:
          type: string
          format: uri
          description: 128×128 variant
        l:
          type: string
          format: uri
          description: 256×256 variant
    IssueTimeInStatus:
      type: object
      description: >
        Status timing derived from the issue's lifecycle facts. `status_durations_ms` is cumulative wall-clock time per
        status across every visit, including re-entry after a backward move or a reopen; the current status's value also
        includes its running visit through `calculated_at`. `current_status_entered_at` is the start of the current
        uninterrupted visit only — its age is not the cumulative dwell for that status. Working-time calendars are not
        applied. Omitted when no lifecycle fact exists yet or the fact has not caught up with the issue's current
        status.
      required:
        - current_status
        - current_status_entered_at
        - calculated_at
        - status_durations_ms
      properties:
        current_status:
          $ref: '#/components/schemas/IssueStatus'
        current_status_entered_at:
          $ref: '#/components/schemas/DateTime'
        calculated_at:
          description: >-
            Server time through which durations were calculated. Add the elapsed time since this instant to the current
            status's duration to keep it advancing client-side.
          allOf:
            - $ref: '#/components/schemas/DateTime'
        status_durations_ms:
          type: object
          description: >-
            Cumulative milliseconds per status. The current status is always present; other statuses appear once the
            issue has spent time in them.
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
          example:
            todo: 86400000
            in_progress: 5400000
    IssueAgentSessionResponse:
      type: object
      description: |
        The state of an issue's current delegated agent run (PUL-802), denormalized onto
        the issue so a list renders it on first paint with no second service hop.

        pulse-agent stays the system of record for the run itself. Its title, activities,
        plan, failure reason and unread marker are deliberately NOT here: the last two are
        per-viewer, and a per-viewer field cannot live on a shared cached document. Read
        those from pulse-agent.

        `finished` means the AGENT stopped working — never that the issue is done. The
        issue's own workflow status is untouched by any of this.

        A value outside this enum should be read as `pending`: new states may be added,
        pulse-api first, and a deployed client must not break on one it has not shipped yet.
      required:
        - state
        - revision
        - attempt
        - updated_at
      properties:
        state:
          type: string
          enum:
            - pending
            - working
            - needs_input
            - finished
            - failed
            - canceled
          example: needs_input
          description: |
            - `pending`: delegated; the run has not started yet.
            - `working`: the agent is running.
            - `needs_input`: the run is blocked on a human.
            - `finished`: the run ended on its own.
            - `failed`: the run errored, or the start failed terminally.
            - `canceled`: the run stopped without finishing — a human stopped it, it was
              superseded, the delegate was removed mid-run, or the owning worker died.
        session_id:
          type: string
          example: sess_01J9XYZ
          description: Omitted for a run with no session yet, or one that failed before it had one.
        revision:
          type: integer
          format: int64
          minimum: 0
          example: 7
          description: >-
            The issue's `delegation_revision` this run belongs to. Compare it with the issue's own `delegation_revision`
            to tell the agent currently on the issue from a leftover of the one it replaced.
        attempt:
          type: integer
          minimum: 0
          example: 1
          description: The run attempt within this delegation revision. A retry is a higher attempt.
        updated_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
            - description: >-
                When the state became true on pulse-agent — not when it was pushed, and not the issue's own
                `updated_at`, which this write does not move.
    SLASummaryResponse:
      type: object
      description: >
        Compact SLA summary embedded on Request/Issue list and detail payloads. Batch-computed from the entity's active
        assignment and open cycles; absent (field omitted) when the entity has no active SLA assignment.
      properties:
        item_state:
          type: string
          enum:
            - ''
            - active
            - at_risk
            - breached
        source:
          type: string
          enum:
            - automatic
            - manual
        rule_id:
          type: string
        rule_title:
          type: string
        match_explanation:
          type: string
        next_deadline_at:
          type: string
          format: date-time
        open_target_count:
          type: integer
    GrantInfo:
      type: object
      description: Embedded in entity responses when the requesting user accessed the entity via an explicit share grant.
      properties:
        grant_id:
          type: string
          description: ID of the ResourceGrant document.
          example: 64b1f2e3a4b5c6d7e8f90010
        permission:
          type: string
          enum:
            - view
            - edit
          description: The access level that was granted.
        granted_at:
          type: string
          format: date-time
          description: When the share was created.
        granted_by_id:
          type: string
          description: User ID of the person who shared the entity.
          example: 64b1f2e3a4b5c6d7e8f90002
        granted_by_name:
          type: string
          description: Display name of the person who shared the entity (enriched).
          example: Alice Smith
        granted_by_avatar_url:
          type: string
          description: Signed URL for the sharer's avatar (enriched).
          example: https://storage.example.com/avatars/alice.jpg?signature=...
    ContentBasic:
      type: object
      required:
        - id
        - title
        - type
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          description: >-
            Stable identity of this content. For a document that is the ROOT of its version chain, which does not change
            when the document is edited — store this, it is what `main_doc_id` and a directory membership's `content_id`
            hold, and what every write endpoint expects. Links, images and videos are not versioned and simply carry
            their own id. The one exception is the `/content/versions/...` responses, whose `id` addresses one version
            row.
        title:
          type: string
          minLength: 2
          maxLength: 200
          example: Project Specification
        description:
          type: string
          maxLength: 500
          nullable: true
          example: Main specification document
        type:
          $ref: '#/components/schemas/ContentType'
        url:
          type: string
          format: uri
          nullable: true
          example: https://storage.example.com/signed-url
        access_url:
          type: string
          format: uri
          nullable: true
          description: >-
            Signed CDN/object-storage URL for anonymous download or embed. Use for share/download flows, not for
            authenticated editor body load.
          example: https://storage.example.com/signed-url
        direct_access_url:
          type: string
          format: uri
          nullable: true
          description: >
            Authenticated API URL for the current document body (`GET …/raw`). Requires the same Bearer token as other
            API routes; may return 200 (body), 304 (ETag), or 302 (large file → signed CDN in Location). Omitted for
            link content and when `APP_API_PUBLIC_URL` is unset.
          example: https://api.trypulse.tech/api/v1/content/documents/674a1b2c3d4e5f678901234/raw
        content_type:
          type: string
          nullable: true
          example: application/pdf
        file_size:
          type: integer
          minimum: 0
          nullable: true
          example: 320000
        checksum:
          type: string
          nullable: true
          example: abc123def456...
        tags:
          type: array
          items:
            type: string
          example:
            - spec
            - main
        is_public:
          type: boolean
          default: false
          description: Currently has no effect on access control (reserved for future public sharing).
          example: false
        icon_code:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[a-zA-Z0-9_-]+$
          nullable: true
          example: file-text
        icon_color:
          type: string
          pattern: ^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$
          nullable: true
          example: '#fb923c'
        version:
          type: integer
          minimum: 0
          example: 1
        is_current_version:
          type: boolean
          example: true
        root_content_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
            - nullable: true
          description: >-
            Explicit chain metadata. Null on unversioned content and on a document that has never been edited; equal to
            `id` afterwards on every response except the version-history ones. Kept for backward compatibility — prefer
            `id`.
        amended_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
            - nullable: true
          description: >-
            When this version was last overwritten in place by the editing session that created it. Distinct from
            `updated_at`, which also moves on bookkeeping writes (version demotion, validation) and so cannot date an
            edit. Present only on rows an autosaving editor amended; render `created_at`–`amended_at` as a range in
            version history.
        edit_session_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            The editing session that owns this version row. Lets a client recognise its own writes. Absent on rows
            written without a session id.
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the content was deleted. Present only on a deleted row, which the documents list returns only with
            `include_deleted=true`.
    ContentType:
      type: string
      enum:
        - link
        - document
        - image
        - video
      description: Type of content
    ReleaseResponse:
      type: object
      required:
        - id
        - pipeline_id
        - name
        - stage_id
        - issue_count
        - completed_issue_count
        - open_issue_count
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        pipeline_id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          minLength: 2
          maxLength: 200
        version:
          type: string
          maxLength: 200
          nullable: true
        commit_sha:
          allOf:
            - $ref: '#/components/schemas/ReleaseCommitSha'
          nullable: true
        stage_id:
          $ref: '#/components/schemas/ObjectId'
        stage_type:
          allOf:
            - $ref: '#/components/schemas/ReleaseStageType'
          description: Denormalized from the release stage; populated on create/update and by migration backfill.
        target_date:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
        released_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
          readOnly: true
          description: >-
            When the release actually shipped, as opposed to `target_date`, which is when it was planned to. Set by the
            server on every transition into a stage of type `released` — including a re-release, which restamps it — and
            cleared when the release leaves such a stage. Never client-writable. Moving between two `released` stages
            keeps the original value.
        assignee_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
        notes_document_id:
          $ref: '#/components/schemas/ObjectId'
          nullable: true
        notes_summary:
          type: string
          nullable: true
        pipeline:
          allOf:
            - $ref: '#/components/schemas/ReleasePipelineSummaryResponse'
          nullable: true
        stage:
          allOf:
            - $ref: '#/components/schemas/ReleaseStageResponse'
          nullable: true
        assignee:
          allOf:
            - $ref: '#/components/schemas/UserBasic'
          nullable: true
        main_doc:
          allOf:
            - $ref: '#/components/schemas/ContentBasic'
          nullable: true
        issue_count:
          type: integer
          minimum: 0
        completed_issue_count:
          type: integer
          minimum: 0
        open_issue_count:
          type: integer
          minimum: 0
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
    ReleaseStageResponse:
      type: object
      required:
        - id
        - pipeline_id
        - name
        - type
        - position
        - is_frozen
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        pipeline_id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          $ref: '#/components/schemas/ReleaseStageType'
        position:
          type: integer
          minimum: 0
        is_frozen:
          type: boolean
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
    ReleaseStageType:
      type: string
      enum:
        - planned
        - started
        - in_progress
        - released
        - canceled
    ReleasePipelineSummaryResponse:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          minLength: 1
          maxLength: 200
    ReleaseCommitSha:
      type: string
      minLength: 7
      maxLength: 40
      pattern: ^[0-9a-fA-F]{7,40}$
      description: >
        The commit this release was cut from, and the baseline the next CI scan measures from. Stored lowercase. Only
        ever moves forward: a deploy of an older commit must omit it, or the following sync re-attaches work that
        already shipped.
    IssueBasic:
      type: object
      required:
        - id
        - code
        - title
        - status
        - priority
        - type
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        code:
          type: string
          example: EN-LIF-1
          description: Auto-generated issue code
        title:
          type: string
          minLength: 2
          maxLength: 200
          example: Implement user login functionality
        description:
          type: string
          maxLength: 500
          nullable: true
          example: Add authentication system with JWT tokens
        status:
          $ref: '#/components/schemas/IssueStatus'
        priority:
          $ref: '#/components/schemas/IssuePriority'
        type:
          $ref: '#/components/schemas/IssueType'
    IssueType:
      type: string
      enum:
        - bug
        - feature
        - task
        - story
      description: Issue type
    Request:
      allOf:
        - $ref: '#/components/schemas/RequestBasic'
        - type: object
          properties:
            customer_id:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
                - nullable: true
              description: >-
                Customer this request came from. Null for internal requests. `contact_id` can only be set when this is
                set.
            contact_id:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
                - nullable: true
              description: Contact at `customer_id` this request came from, if known.
            source:
              type: string
              enum:
                - manual
              description: Where the request entered Pulse. Only `manual` (staff-entered) exists today.
              example: manual
            external_reference:
              type: string
              maxLength: 200
              nullable: true
              description: >-
                Optional externally-supplied identifier (e.g. a ticket ID from the customer's own system). Unique per
                `(workspace_id, source, external_reference)` among non-deleted requests.
            customer:
              allOf:
                - $ref: '#/components/schemas/Customer'
                - nullable: true
              description: Enriched customer (when `customer_id` is set).
            contact:
              allOf:
                - $ref: '#/components/schemas/Contact'
                - nullable: true
              description: Enriched contact (when `contact_id` is set).
            reviewer_id:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
                - nullable: true
            reviewed_at:
              allOf:
                - $ref: '#/components/schemas/DateTime'
                - nullable: true
            expected_completion_at:
              allOf:
                - $ref: '#/components/schemas/DateTime'
                - nullable: true
              description: Reviewer commitment for when accepted work should finish (full date-time, RFC3339)
            duplicate_of_id:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
                - nullable: true
              description: The canonical request this one duplicates; null when not a duplicate.
            duplicate_ids:
              type: array
              items:
                $ref: '#/components/schemas/ObjectId'
              description: IDs of requests marked as duplicates of this one (canonical side only)
            duplicate_of:
              allOf:
                - $ref: '#/components/schemas/RequestRef'
                - nullable: true
              description: Enriched canonical request reference (when duplicate_of_id is set)
            duplicates:
              type: array
              items:
                $ref: '#/components/schemas/RequestRef'
              description: Enriched duplicate request references (when duplicate_ids is non-empty)
            team:
              allOf:
                - $ref: '#/components/schemas/TeamBasic'
                - nullable: true
            requester:
              allOf:
                - $ref: '#/components/schemas/User'
                - nullable: true
            requester_team:
              allOf:
                - $ref: '#/components/schemas/TeamBasic'
                - nullable: true
              description: >-
                Display enrichment for the requesting team. When `requester_team_id` is set this resolves it. When it is
                NULL the server may still fall back to a team derived from the requester's own memberships, so this
                object can be present while `requester_team_id` is null — `requester_team_id` is the stored attribution
                and the only thing to branch on; this is a best-effort label.
            reviewer:
              allOf:
                - $ref: '#/components/schemas/User'
                - nullable: true
            key_results:
              type: array
              items:
                $ref: '#/components/schemas/KeyResult'
              description: Enriched key result data (when key_result_ids are provided)
            projects:
              type: array
              items:
                $ref: '#/components/schemas/ProjectBasic'
              description: Enriched project data (when project_ids are provided)
            issues:
              type: array
              items:
                $ref: '#/components/schemas/IssueBasic'
              description: Enriched issue data (when issue_ids are provided)
            label_ids:
              type: array
              items:
                $ref: '#/components/schemas/ObjectId'
            labels:
              type: array
              items:
                $ref: '#/components/schemas/CatalogLabel'
            main_doc_id:
              allOf:
                - $ref: '#/components/schemas/ObjectId'
                - nullable: true
              description: Denormalized pointer to the request's main document (root content ID).
            main_doc:
              allOf:
                - $ref: '#/components/schemas/ContentBasic'
                - nullable: true
              description: Enriched main document (when main_doc_id is set).
            is_subscribed:
              type: boolean
              description: >
                True when the current user has an explicit `subscribed` row. Absence of a row does not guarantee
                silence—implicit/auto subscribers may still receive notifications until they unsubscribe.
            subscriber_count:
              type: integer
              minimum: 0
              description: Count of explicit `subscribed` rows for this request.
            grant_info:
              allOf:
                - $ref: '#/components/schemas/GrantInfo'
                - nullable: true
