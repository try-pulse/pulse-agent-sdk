    KeyResultStatus:
      type: string
      enum:
        - on_track
        - at_risk
        - off_track
        - completed
      description: Key result status
    KeyResultValueType:
      type: string
      enum:
        - number
        - percentage
        - currency
        - custom
      description: Value type for measurements
    StepTarget:
      type: object
      required:
        - period_start
        - period_end
        - target_value
      properties:
        period_start:
          $ref: '#/components/schemas/DateTime'
          description: Start date of the period (inclusive)
        period_end:
          $ref: '#/components/schemas/DateTime'
          description: End date of the period (inclusive)
        target_value:
          type: number
          format: float
          minimum: 0
          exclusiveMinimum: true
          example: 25
          description: Target value for this specific period
        baseline:
          type: number
          format: float
          nullable: true
          example: 0
          description: Optional baseline for this period. If not provided, uses the Key Result's baseline.
    KeyResultPeriodType:
      type: string
      enum:
        - weekly
        - monthly
      description: Period granularity for stepwise/cumulative/average tracking
    KeyResultDirection:
      type: string
      enum:
        - increasing
        - decreasing
      description: |
        Direction of progress (automatically calculated):
        - increasing: Higher values are better (target > baseline)
        - decreasing: Lower values are better (target < baseline)
    KeyResultTargetType:
      type: string
      enum:
        - final_value
        - stepwise
        - cumulative
        - average_based
        - threshold_based
        - growth_rate
        - boolean
      description: |
        Progress calculation model:
        - final_value: Only final value matters (default)
        - stepwise: Target divided equally across periods (or custom step_targets), progress averaged
        - cumulative: Sum of all measurements compared to target
        - average_based: Average of measurements compared to target
        - threshold_based: No progress until minimum threshold reached
        - growth_rate: Percentage growth from baseline to target
        - boolean: Binary achievement (0% or 100%)
    User:
      type: object
      required:
        - id
        - email
        - role
        - status
        - team_memberships
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        email:
          type: string
          format: email
          example: user@example.com
        role:
          type: string
          enum:
            - admin
            - user
          example: user
        first_name:
          type: string
          example: Ali
        last_name:
          type: string
          example: Fazeli
        job_title:
          type: string
          maxLength: 100
          description: >-
            Optional free-text job title. Absent when the user has never set one, or cleared it. Global to the user, not
            per-workspace.
          example: Staff Engineer
        display_name:
          type: string
          example: Ali Fazeli
          description: concatenated first name and last name, fallback to email
        is_agent:
          type: boolean
          description: >-
            True only for the Pulse Agent's own account. The agent is an ordinary user — that is what makes it
            mentionable and assignable — so this derived flag is the only way to tell it apart. Clients MUST badge it
            wherever it appears (comment authors, mention chips, member lists); an agent that reads as a human is
            exactly what the agent guidelines forbid. Absent for every human, so present-and-true is the whole contract.
          example: true
        user_kind:
          type: string
          enum:
            - human
            - application
          description: >-
            Authoritative classification of the account. `application` marks a managed application identity (the Pulse
            Agent today, future automated actors tomorrow); `human` is everyone else. Always present. Clients choosing
            presentation or allowed actions must branch on this (or `is_agent`, or `agent_kind`), never on name, email,
            avatar, or a Pulse-Agent-specific constant.
          example: application
        agent_kind:
          allOf:
            - $ref: '#/components/schemas/AgentKind'
          description: >-
            Present only when `user_kind` is `application`: `deployment` (Pulse Agent), `personal` (a member's own
            agent) or `app` (an installed agent app).
        avatar_url:
          type: string
          format: uri
          nullable: true
          description: Public URL to user's avatar image
          example: https://storage.example.com/avatars/user123/1234567890.jpg
        avatar_urls:
          $ref: '#/components/schemas/AvatarURLSet'
        avatar_status:
          type: string
          enum:
            - pending
            - processing
            - processed
          nullable: true
          description: >-
            AI avatar-processing status. Absent/null for users who have never uploaded an avatar. "pending"/"processing"
            mean an AI-enhanced version is being generated in the background — poll this endpoint until it becomes
            "processed", at which point avatar_url reflects the final image (or the original, if generation ultimately
            failed after retries).
          example: processed
        status:
          type: string
          enum:
            - active
            - blocked
            - pending
          example: active
        team_memberships:
          type: array
          description: Array of team memberships (supports many-to-many relationship)
          items:
            $ref: '#/components/schemas/TeamMembership'
          example:
            - team_id: 60f7b3b3b3b3b3b3b3b3b3b4
              team_role: manager
            - team_id: 60f7b3b3b3b3b3b3b3b3b3b5
              team_role: member
        teams:
          type: array
          description: Enriched team data (not persisted, populated on read)
          items:
            $ref: '#/components/schemas/TeamBasic'
          nullable: true
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
    RequestRef:
      type: object
      required:
        - id
        - code
        - title
        - status
        - type
        - priority
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        code:
          type: string
        title:
          type: string
        status:
          type: string
        type:
          type: string
        priority:
          type: string
    Contact:
      type: object
      required:
        - id
        - customer_id
        - name
        - email
        - archived
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        workspace_id:
          type: string
          description: Owning workspace ID.
        customer_id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          format: email
          maxLength: 320
          description: Normalized (lowercased, trimmed) email. Unique per `(customer_id, email)` among active contacts.
        job_title:
          type: string
          maxLength: 120
        archived:
          type: boolean
          description: Contacts are archived, never deleted — there is no DELETE endpoint.
        archived_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
            - nullable: true
        created_by:
          $ref: '#/components/schemas/ObjectId'
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
        customer:
          allOf:
            - $ref: '#/components/schemas/Customer'
            - nullable: true
          description: >-
            Enriched parent customer. Populated where the caller enriches contacts against their customer (e.g. via a
            request's `contact` field); not populated on `/contacts` list/get responses.
    Customer:
      type: object
      required:
        - id
        - name
        - archived
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        workspace_id:
          type: string
          description: Owning workspace ID.
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Acme Corp
        domains:
          type: array
          items:
            type: string
          description: >-
            Normalized domains (scheme, `www.`, path, and `@` prefix stripped) used to identify the customer. Unique per
            workspace among active (non-archived, non-deleted) customers.
          example:
            - acme.com
            - acme.io
        notes:
          type: string
          maxLength: 2000
        icon_code:
          type: string
          maxLength: 64
        icon_color:
          type: string
          maxLength: 16
        status_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
            - nullable: true
          description: >-
            Workspace-managed status catalog value. Absent when the customer has no status — which is the truth for
            every customer created before statuses existed, since the migration deliberately does not invent one.
        status:
          allOf:
            - $ref: '#/components/schemas/CustomerCatalogValue'
            - nullable: true
          description: >-
            Enrichment for display. Resolves archived values too, so a customer still pointing at a retired status
            renders its name rather than a blank cell. May be absent if the lookup failed — never treat a missing object
            as a missing value; `status_id` is the contract.
        tier_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
            - nullable: true
        tier:
          allOf:
            - $ref: '#/components/schemas/CustomerCatalogValue'
            - nullable: true
        annual_revenue:
          type: integer
          format: int64
          nullable: true
          description: >-
            Whole-unit amount in the workspace's configured currency (`GET /customer-settings`). Account metadata for
            segmentation only — not a pipeline or forecast figure, and it carries no date or stage. Absent and `0` are
            different answers: absent means nothing was recorded.
        size:
          type: integer
          format: int64
          nullable: true
          description: Headcount.
        owner_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
            - nullable: true
          description: >-
            A workspace member. Routing and accountability only — owning a customer grants no access to its requests or
            to any delivery work linked to them.
        owner:
          allOf:
            - $ref: '#/components/schemas/CustomerOwner'
            - nullable: true
        logo_url:
          type: string
          description: >-
            Signed, expiring URL for the uploaded logo. Derived per response — never persist it client-side. Absent when
            no logo has been uploaded, in which case `icon_code`/`icon_color` are the fallback mark.
        request_count:
          type: integer
          format: int64
          nullable: true
          description: >-
            Number of requests linked to this customer that THE CALLER may see, computed per response with the caller's
            visibility applied. It is never denormalized, because a stored total would disclose the existence of work on
            teams the caller cannot read. Absent (rather than `0`) when the deployment could not compute it, so a client
            can tell "none" from "unknown". Not filterable or sortable, for the same reason.
        merged_into_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
            - nullable: true
          description: >-
            Set on a customer absorbed by another. The row is kept, archived and pointed at the survivor so an old link
            resolves to a tombstone the client can follow instead of a 404.
        merged_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
            - nullable: true
        archived:
          type: boolean
          description: Customers are archived, never deleted — there is no DELETE endpoint.
        archived_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
            - nullable: true
        created_by:
          $ref: '#/components/schemas/ObjectId'
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
          description: >-
            Enriched active contacts for this customer. Only populated by `GET /customers/{id}`, never on list
            responses.
    CustomerOwner:
      type: object
      description: Trimmed member projection returned beside `owner_id`.
      required:
        - id
        - active
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        display_name:
          type: string
        email:
          type: string
          format: email
        avatar_url:
          type: string
          description: Signed, expiring URL.
        active:
          type: boolean
          description: >-
            `false` when the stored owner is no longer a member of this workspace. The id is kept rather than erased so
            the directory can show which rows need reassigning; a DELETED user's reference is cleared instead, by the
            user-deleted listener.
    CustomerCatalogValue:
      type: object
      description: >-
        One entry in a workspace's customer status or tier catalog. Values are archived, never deleted, so a customer
        that ever referenced one keeps resolving it and historical records stay legible.
      required:
        - id
        - kind
        - name
        - sort_order
        - is_default
        - archived
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        workspace_id:
          type: string
        kind:
          type: string
          enum:
            - status
            - tier
        name:
          type: string
          minLength: 1
          maxLength: 60
        color:
          type: string
          maxLength: 16
          description: '`#rrggbb`, or empty for the client''s neutral swatch.'
        description:
          type: string
          maxLength: 200
        sort_order:
          type: integer
        is_default:
          type: boolean
          description: >-
            Applied to a customer created without an explicit choice. At most one live value per kind carries it;
            setting it demotes the previous holder. Archiving a value clears it.
        archived:
          type: boolean
        archived_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
            - nullable: true
        created_by:
          type: string
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
    RequestBasic:
      type: object
      required:
        - id
        - code
        - title
        - type
        - status
        - team_id
        - requester_id
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        code:
          type: string
          description: Human-readable code for the request (e.g., "EIR", "NTFR-1")
          example: EIR
        title:
          type: string
          minLength: 3
          maxLength: 200
          example: Login button not working on mobile
        description:
          type: string
          maxLength: 500
          example: When clicking the login button on mobile Safari, nothing happens. This is blocking users from logging in.
        type:
          type: string
          enum:
            - bug
            - feature
            - other
          example: bug
        status:
          type: string
          enum:
            - triage
            - pending
            - accepted
            - rejected
            - done
            - duplicate
          example: triage
        team_id:
          $ref: '#/components/schemas/ObjectId'
        requester_id:
          $ref: '#/components/schemas/ObjectId'
        requester_team_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
            - nullable: true
        key_result_ids:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
          description: Optional array of key result IDs this request is linked to (specific measurable outcomes)
          example:
            - 507f1f77bcf86cd799439011
            - 507f1f77bcf86cd799439012
        project_ids:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
          description: Optional array of project IDs this request is linked to
          example:
            - 507f1f77bcf86cd799439013
            - 507f1f77bcf86cd799439014
        issue_ids:
          type: array
          items:
            $ref: '#/components/schemas/ObjectId'
          description: Optional array of issue IDs this request is linked to
          example:
            - 507f1f77bcf86cd799439015
            - 507f1f77bcf86cd799439016
    Milestone:
      type: object
      required:
        - id
        - project_id
        - name
        - sort_order
        - created_at
        - updated_at
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        project_id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Public launch
        description:
          type: string
          maxLength: 500
          example: Everything needed to open the product to all customers
        target_date:
          allOf:
            - $ref: '#/components/schemas/DateTime'
          nullable: true
          description: Optional. Set to `null` to unset; omit to leave unchanged.
        sort_order:
          type: integer
          minimum: 0
          example: 2
          description: Manual position within the project. Change it with the reorder endpoint.
        main_doc_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
          nullable: true
          description: Rich description document, attached via the content endpoints with entity_type "milestone".
        status:
          type: string
          enum:
            - unstarted
            - in_progress
            - completed
          example: in_progress
          description: >-
            Derived from the linked issues, never stored. A milestone with no issues is "unstarted". Absent where stats
            were not computed — notably the milestone embedded in an issue response.
        is_current:
          type: boolean
          example: true
          description: >-
            True for the first non-completed milestone in the project's ordering — the one being worked towards. Only
            set where the full project ordering is known (project detail and the project's milestone list), not on the
            cross-project milestone list.
        stats:
          allOf:
            - $ref: '#/components/schemas/MilestoneStats'
            - nullable: true
          description: Issue count and progress statistics. Present in project detail responses.
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
    MilestoneStats:
      type: object
      description: Aggregated issue statistics for a milestone
      properties:
        total_issues:
          type: integer
          minimum: 0
          example: 10
          description: Total number of issues linked to this milestone
        started_issues:
          type: integer
          minimum: 0
          example: 2
          description: Number of issues with status "in_progress", "qa" or "release"
        done_issues:
          type: integer
          minimum: 0
          example: 4
          description: Number of issues with status "done"
        total_points:
          type: integer
          minimum: 0
          example: 21
          description: >-
            Weighted equivalent of total_issues. An issue weighs its estimate when its own team has estimates enabled,
            and 1 otherwise — so for a team that never enabled estimates, points equal issue counts.
        started_points:
          type: integer
          minimum: 0
          example: 5
          description: Weighted equivalent of started_issues.
        done_points:
          type: integer
          minimum: 0
          example: 8
          description: Weighted equivalent of done_issues.
        estimated_issues:
          type: integer
          minimum: 0
          example: 6
          description: >-
            How many of total_issues carry an estimate that was actually applied. An unestimated issue is excluded even
            on a team with estimates enabled, because it still weighs the flat fallback. Zero means every point equals
            one issue.
        estimate_based:
          type: boolean
          example: true
          description: Convenience for estimated_issues > 0.
        progress:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 50
          description: >-
            Completion percentage over points. A started issue contributes half a unit and a done issue a full one:
            (done_points + 0.5 × started_points) / total_points × 100. Zero when total_points is zero — which happens
            for a team that enabled estimates, turned off counting unestimated issues, and has estimated nothing yet. A
            milestone in that state still reports status "completed" once all its issues are done: completion is decided
            by issue counts, not points.
    IssueDevelopmentSummary:
      type: object
      description: >-
        Compact source-control summary embedded on issue LIST reads only. Full artifact data — and the only source of
        truth for whether an issue has links at all — remains on GET /issues/{id}/development-links.
      required:
        - total
        - pull_requests
        - merge_requests
        - commits
        - branches
        - primary_draft
      properties:
        total:
          type: integer
          minimum: 1
        pull_requests:
          type: integer
          minimum: 0
        merge_requests:
          type: integer
          minimum: 0
        commits:
          type: integer
          minimum: 0
        branches:
          type: integer
          minimum: 0
        primary_provider:
          type: string
          enum:
            - github
            - gitlab
        primary_kind:
          type: string
          enum:
            - pull_request
            - merge_request
            - commit
            - branch
        primary_label:
          type: string
        primary_state:
          type: string
          enum:
            - draft
            - open
            - closed
            - merged
            - unknown
        primary_draft:
          type: boolean
    IssueProgress:
      type: object
      description: Progress tracking for parent issues with sub-tasks
      properties:
        total:
          type: integer
          minimum: 0
          description: Total number of sub-tasks
          example: 5
        done:
          type: integer
          minimum: 0
          description: Number of completed sub-tasks
          example: 3
        updated_at:
          $ref: '#/components/schemas/DateTime'
          description: Last progress calculation time
    Conflict:
      type: object
      description: >-
        Identifies the resource a write collided with. Which fields are populated depends on the endpoint — an identity
        conflict (e.g. duplicate external reference) carries `id`/`code`; a state conflict (e.g. acting on an
        already-resolved resource) carries `status` instead.
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
          description: ID of the conflicting/existing resource.
        code:
          type: string
          description: Human-readable code of the conflicting resource, when applicable.
        status:
          type: string
          description: >-
            Current status of the existing resource, when the conflict is with its own state rather than another
            resource's identity.
    AgentSession:
      type: object
      description: >-
        An agent session as an app sees it. Identical to `AgentSession` in pulse-agent's Agent Session API (`GET
        /agent-sessions/{session_id}`).
      required:
        - id
        - state
        - unresponsive_since
        - issue
        - comment
        - creator
        - app_user_id
        - plan
        - external_urls
        - created_at
        - updated_at
        - ended_at
        - end_reason
      properties:
        id:
          type: string
          example: sess_01J9Z3K8T5N2
        state:
          $ref: '#/components/schemas/AgentSessionState'
        unresponsive_since:
          type: string
          format: date-time
          nullable: true
          description: >-
            Set when neither an app activity nor an external URL arrived within 10 seconds of creation; cleared by the
            first one.
        issue:
          type: object
          nullable: true
          description: The issue the session works on. Null for a mention on a project comment.
          required:
            - id
            - identifier
            - title
            - url
            - team
          properties:
            id:
              type: string
            identifier:
              type: string
              description: The issue code.
              example: PUL-123
            title:
              type: string
            url:
              type: string
              format: uri
            team:
              type: object
              required:
                - id
                - key
                - name
              properties:
                id:
                  type: string
                key:
                  type: string
                  description: The team's issue key prefix.
                  example: PUL
                name:
                  type: string
        comment:
          type: object
          nullable: true
          description: The comment that opened a mention session. Null for a delegation session.
          required:
            - id
            - body
            - url
          properties:
            id:
              type: string
            body:
              type: string
              description: Markdown.
            url:
              type: string
              format: uri
        creator:
          allOf:
            - $ref: '#/components/schemas/AgentSessionPerson'
          description: The human who delegated or mentioned the app. For a session the app created itself, the app user.
        app_user_id:
          type: string
        plan:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AgentSessionPlanItem'
        external_urls:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/AgentSessionExternalUrl'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
          nullable: true
          description: Set when the session ended with an `end_reason`.
        end_reason:
          $ref: '#/components/schemas/AgentSessionEndReason'
    AgentSessionEndReason:
      type: string
      nullable: true
      description: |
        Why a human or Pulse is ending, or ended, the session rather than the app. For
        `stopped` and `undelegated` it is set as soon as the session enters `stopping`, so
        the app knows why it is being stopped; `uninstalled`, `team_removed` and
        `issue_deleted` end the session at once, with no `stopping` and no `prompted`.
        `ended_at` is set when the session actually ends. Null otherwise. Once the session has
        ended with one of these, app writes answer `409 SESSION_ENDED`.

        - `stopped`: a human pressed Stop.
        - `undelegated`: the issue was undelegated or delegated to another agent.
        - `uninstalled`: the app was uninstalled.
        - `team_removed`: the installation no longer covers the issue's team.
        - `issue_deleted`: the issue was deleted.
      enum:
        - stopped
        - undelegated
        - uninstalled
        - team_removed
        - issue_deleted
        - null
    AgentSessionExternalUrl:
      type: object
      required:
        - label
        - url
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
          example: Open in Scout
        url:
          type: string
          format: uri
          pattern: ^https://
          description: Unique within a session.
          example: https://scout.acme.example/runs/42
    AgentSessionPlanItem:
      type: object
      required:
        - content
        - status
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 500
          example: Read the issue and its threads
        status:
          type: string
          enum:
            - pending
            - inProgress
            - completed
            - canceled
    AgentSessionState:
      type: string
      description: |
        Derived by Pulse from the app's last activity; the app never sets it directly.

        - `pending`: created, or reopened by a human prompt; nothing from the app yet.
        - `active`: the last app activity was a `thought` or an `action`.
        - `awaitingInput`: the last app activity was an `elicitation`.
        - `error`: the last app activity was an `error`.
        - `complete`: the last app activity was a `response`, or Pulse ended the session.
        - `stale`: 30 minutes passed in `pending` or `active` with no app activity.
          Recoverable: any app activity or human prompt moves it on.
        - `stopping`: a human pressed Stop, or the issue was undelegated; see `end_reason`.
          The app's next `response` or `error`, or 60 seconds, ends it as `complete`.
      enum:
        - pending
        - active
        - awaitingInput
        - error
        - complete
        - stale
        - stopping
  responses:
    IssueWriteForbidden:
      description: >
        Insufficient permissions (`FORBIDDEN`), a missing OAuth scope (`INSUFFICIENT_SCOPE`, see InsufficientScope), a
        team where the caller may not create issues (`TEAM_ACCESS_FORBIDDEN`: creating an issue in it, or moving an
        issue into it), or a status an agent app may not set (`APP_STATUS_FORBIDDEN`). An agent app token may create an
        issue only in `backlog`, `todo`, `in_progress` or `qa`, and may change an issue's status only to `in_progress`
        or `qa`; closing (`release`, `done`) stays with a person.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            forbidden:
              value:
                code: FORBIDDEN
                message: Insufficient permissions to access this resource
            teamAccessForbidden:
              value:
                code: TEAM_ACCESS_FORBIDDEN
                message: You can't create issues in this team
            appStatusForbidden:
              value:
                code: APP_STATUS_FORBIDDEN
                message: Agent apps cannot move an issue to done
                details:
                  status: done
                  allowed:
                    - in_progress
                    - qa
            insufficientScope:
              value:
                code: INSUFFICIENT_SCOPE
                message: This token is missing a required scope
                details:
                  required:
                    - write
                    - issues:create
                  granted:
                    - read
    Unauthorized:
      description: Unauthorized - Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Authentication required
    IssueWriteBadRequest:
      description: |
        Bad Request - Invalid input data. A refused agent delegate answers `INVALID_DELEGATE`
        with a localized `message` and a stable `details.reason` (InvalidDelegateDetails).
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  details:
                    anyOf:
                      - $ref: '#/components/schemas/InvalidDelegateDetails'
                      - type: object
                        additionalProperties: true
          examples:
            invalidRequest:
              value:
                code: INVALID_REQUEST
                message: Invalid request format
            invalidDelegate:
              value:
                code: INVALID_DELEGATE
                message: Delegate agent has no access to the issue's team
                details:
                  reason: no_team_access
    NotFound:
      description: Not Found - Resource does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_FOUND
            message: Resource not found
    BadRequest:
      description: Bad Request - Invalid input data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_REQUEST
            message: Invalid request format
  parameters:
    Id:
      name: id
      in: path
      description: Resource ID
      required: true
      schema:
        $ref: '#/components/schemas/ObjectId'
