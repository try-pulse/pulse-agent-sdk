    KeyResult:
      type: object
      required:
        - id
        - objective_id
        - title
        - weight
        - target_type
        - direction
        - baseline
        - target_value
        - current_value
        - value_type
        - status
        - progress
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        objective_id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
          minLength: 2
          maxLength: 200
          example: Increase user engagement
        description:
          type: string
          minLength: 10
          maxLength: 500
          example: Improve daily active user engagement
        weight:
          type: integer
          minimum: 0
          maximum: 100
          example: 80
        target_type:
          $ref: '#/components/schemas/KeyResultTargetType'
        direction:
          $ref: '#/components/schemas/KeyResultDirection'
          description: Automatically calculated from baseline and target values
        baseline:
          type: number
          format: float
          default: 0
          example: 0
          description: >-
            Starting value for progress calculation. Required, defaults to 0. Set from metric current_value when
            linking.
        target_value:
          type: number
          format: float
          example: 100
        current_value:
          type: number
          format: float
          example: 75
          description: Current value. Automatically updated from linked metric or manually set via API.
        min_threshold:
          type: number
          format: float
          nullable: true
          example: 50
          description: Required for threshold_based target type. No progress counted until this value is reached.
        period_type:
          allOf:
            - $ref: '#/components/schemas/KeyResultPeriodType'
            - nullable: true
          description: Required for stepwise, cumulative, and average_based target types
        step_targets:
          type: array
          items:
            $ref: '#/components/schemas/StepTarget'
          description: >
            Custom targets for each period in stepwise Key Results.

            If provided, measurements are matched to periods by date range and use the specific target for that period.

            If not provided or a measurement falls outside all defined periods, the system falls back to equal division
            of the total target_value.

            Periods must not overlap and period_end must be after period_start.
        progress:
          type: number
          format: float
          minimum: 0
          maximum: 100
          example: 75
          description: Cached progress value, recalculated if older than 24 hours
        last_calculated_at:
          allOf:
            - $ref: '#/components/schemas/DateTime'
            - nullable: true
          description: When progress was last calculated
        value_type:
          $ref: '#/components/schemas/KeyResultValueType'
        value_unit:
          type: string
          maxLength: 20
          nullable: true
          example: '%'
        metric_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
            - nullable: true
          description: ID of the linked metric. When set, baseline and current_value are automatically synced from the metric.
        owner_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
            - nullable: true
        status:
          $ref: '#/components/schemas/KeyResultStatus'
        owner:
          allOf:
            - $ref: '#/components/schemas/UserBasic'
            - nullable: true
        metric:
          allOf:
            - $ref: '#/components/schemas/Metric'
            - nullable: true
          description: Enriched metric data (only present when metric_id is set)
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/KRMeasurement'
          description: Historical measurements for this key result (enriched data)
        measurement_count:
          type: integer
          example: 5
          description: Total number of measurements
        initiatives:
          type: array
          items:
            $ref: '#/components/schemas/InitiativeBasic'
        main_doc_id:
          allOf:
            - $ref: '#/components/schemas/ObjectId'
            - nullable: true
        main_doc:
          allOf:
            - $ref: '#/components/schemas/ContentBasic'
            - nullable: true
        content:
          type: array
          items:
            $ref: '#/components/schemas/ContentBasic'
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
    InitiativeBasic:
