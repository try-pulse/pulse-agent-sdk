    InitiativePriority:
      type: string
      enum:
        - no_priority
        - urgent
        - high
        - medium
        - low
      description: >-
        Initiative priority. Sorting is served by the numeric `priority_order` column shared with projects and issues
        (ascending, urgent first, no_priority last); sort by `priority` or `priority_order`.
      default: no_priority
    InitiativeStatus:
      type: string
      enum:
        - proposed
        - planned
        - active
        - completed
        - canceled
      description: >-
        Initiative lifecycle status. `completed` and `canceled` are the terminal states, and both are excluded from
        check-in nudges. Progress and status stay coupled unless the initiative is canceled: reaching 100% sets
        `completed`, dropping below 100% reopens a `completed` initiative as `active`, and a `canceled` initiative keeps
        its status through any progress change.
    KRMeasurement:
