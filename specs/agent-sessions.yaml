openapi: 3.1.0
info:
  title: Pulse Agent Session API
  version: 1.0.0
  summary: The API an installed agent app uses to answer its agent sessions.
  description: |
    Contract for third-party **agent apps** (PUL-929-3; implemented by PUL-931-2). An agent
    app is installed into a workspace by an admin, receives `AgentSessionEvent` webhooks from
    pulse-api when it is delegated an issue or @mentioned in a comment, and answers here: it
    posts activities, updates the session's plan and external links, reads the conversation
    back, and may open a session itself.

    pulse-agent serves these routes at `/v1/agent-sessions`; they are published on the API
    host as `https://api.trypulse.tech/api/v1/agent-sessions`. Path keys below are relative to
    that `/api/v1` base. The webhook envelope, the OAuth install flow, scopes and the manifest
    are pulse-api's contract (`docs/openapi/` in pulse-api: `AppWebhookEnvelope`,
    `AgentSessionEventCreatedData`, `AgentSessionEventPromptedData`). `AgentSession`,
    `PlanItem`, `ExternalUrl` and the prompted activity are identical in both files.

    ## Authentication

    - `Authorization: Bearer <app access token>` — an agent app token from
      `POST /api/v1/oauth/token` (`actor=app`); pulse-agent's token introspection reports
      `token_use: app`.
    - `X-Workspace-ID: <workspace_id>` — the installation's workspace, from the token response.
    - A session is visible only to the app it belongs to: any other token gets `404`.
    - `GET` needs `read`; `POST` and `PATCH` need `write` (`403 INSUFFICIENT_SCOPE` otherwise).
    - An app token is refused on every other pulse-agent route.

    ## Timings

    | What | Limit |
    | --- | --- |
    | Answer the webhook | 5 seconds (pulse-api's delivery timeout) |
    | First activity or external URL after `created` | 10 seconds, else `unresponsive_since` is set |
    | Idle before `stale` | 30 minutes without an app activity in `pending` or `active` |
    | Stop grace | 60 seconds from Stop to a forced end |

    ## Rate limits

    10 activities per second per session and 600 requests per minute per installation.
    Beyond that: `429 RATE_LIMIT_EXCEEDED` with `Retry-After` (seconds).

    ## State machine (normative)

    1. Pulse creates a session on a delegation or a mention; it starts in `pending` and the app
       receives `AgentSessionEvent` / `created`.
    2. App activities set the state: `thought` / `action` → `active`, `elicitation` →
       `awaitingInput`, `response` → `complete`, `error` → `error`.
    3. If neither an app activity nor an external URL arrives within 10 seconds of creation,
       `unresponsive_since` is set. The first one clears it.
    4. After 30 minutes in `pending` or `active` with no app activity the state becomes
       `stale`. Any app activity, or a human prompt, recovers it.
    5. A human prompt on a `complete`, `error` or `stale` session reopens it to `pending`; on
       any session it emits `AgentSessionEvent` / `prompted`.
    6. Human Stop moves the session to `stopping` and emits `prompted` with
       `agent_activity.signal: stop`. The app's next `response` or `error`, or 60 seconds,
       ends it as `complete` with `end_reason: stopped`. `thought` and `action` posted while
       `stopping` are stored but do not change the state.
    7. Undelegation (or delegation to another agent) behaves like Stop, with
       `end_reason: undelegated`.
    8. Uninstall, team removal and issue deletion end the session at once as `complete`
       with `end_reason` `uninstalled`, `team_removed` or `issue_deleted`: no `stopping`,
       no `prompted`, no grace period — the app no longer has the access to answer. It
       learns from `OAuthApp` / `revoked`, `PermissionChange` / `teamAccessChanged`, or an
       opted-in `Issue` / `remove` event.
    9. After an end with an `end_reason`, every app write answers `409 SESSION_ENDED`.

    The internal `interrupted` state is never shown to apps.

    ## Errors

    Every error body is `{code, message, details}` (`Error`), as in pulse-api.
servers:
  - url: https://api.trypulse.tech/api/v1
    description: Production (published by the gateway to pulse-agent `/v1`)
  - url: https://api-stage.trypulse.tech/api/v1
    description: Staging
security:
  - AppToken: []
tags:
  - name: Agent Sessions
    description: Sessions an agent app answers
  - name: Agent Activities
    description: What an agent app says and does in a session

paths:
  /agent-sessions:
    get:
      tags: [Agent Sessions]
      operationId: listAgentSessions
      summary: List the app's sessions
      description: Newest first. Only sessions of the calling app in the `X-Workspace-ID` workspace.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
        - name: issue_id
          in: query
          schema:
            type: string
        - name: state
          in: query
          description: Repeat or comma-separate to match several states.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/AgentSessionState'
          style: form
          explode: true
        - name: cursor
          in: query
          description: '`next_cursor` of the previous page.'
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: One page of sessions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSessionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Agent Sessions]
      operationId: createAgentSession
      summary: Open a session proactively on an issue or a comment
      description: |
        The app starts work nobody delegated or mentioned — the equivalent of Linear's
        `agentSessionCreateOnIssue` / `agentSessionCreateOnComment`. Send exactly one of
        `issue_id` or `comment_id`. The app must be able to see the entity (its installation
        covers the team); otherwise `404`. No `created` webhook is sent for a session the app
        opened itself, and `creator` is the app user.

        On a comment there is at most one open session per app per thread: if one exists it is
        returned with `200` instead of `201`.
      parameters:
        - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSessionCreate'
            examples:
              onIssue:
                value:
                  issue_id: 6ab5b0024f48187cbd3ce990
              onComment:
                value:
                  comment_id: 6ab5b0414f48187cbd3ce9b2
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '200':
          description: The app's open session on that comment thread
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /agent-sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Agent Sessions]
      operationId: getAgentSession
      summary: Get a session
      responses:
        '200':
          description: The session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    patch:
      tags: [Agent Sessions]
      operationId: updateAgentSession
      summary: Update the session's plan and external links
      description: |
        Only the fields sent change.

        - `plan` replaces the whole plan (at most 50 items).
        - `external_urls` replaces the whole list (at most 10, unique `url`).
        - `added_external_urls` / `removed_external_urls` change the list incrementally
          (adding an existing `url` replaces its label; removing an absent `url` is a no-op).
          They cannot be combined with `external_urls` (`422`).

        Setting an external URL counts as the app's first sign of life for the 10-second
        rule (it clears `unresponsive_since`), but does not change `state`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentSessionUpdate'
            examples:
              plan:
                value:
                  plan:
                    - content: Read the issue and its threads
                      status: completed
                    - content: Draft the change
                      status: inProgress
                    - content: Report back
                      status: pending
              addUrl:
                value:
                  added_external_urls:
                    - label: Open in Scout
                      url: https://scout.acme.example/runs/42
      responses:
        '200':
          description: The updated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SessionEnded'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /agent-sessions/{session_id}/activities:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags: [Agent Activities]
      operationId: listAgentActivities
      summary: Read the session's activities
      description: |
        Activities in `seq` order, oldest first, including human prompts with their author.
        Rebuild the conversation from here rather than from issue comments.

        `seq` is monotonic but has gaps: poll with `after_seq` set to the previous page's
        `last_seq` and never assume consecutive numbers. A superseded ephemeral activity stays
        in the list with `superseded_by_seq` set; clients hide it.
      parameters:
        - name: after_seq
          in: query
          description: Only activities with a larger `seq`. Omit to start from the beginning.
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        '200':
          description: One page of activities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentActivityPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [Agent Activities]
      operationId: createAgentActivity
      summary: Post an activity
      description: |
        The app's thoughts, actions, questions and results. Bodies are Markdown; Pulse app
        URLs render as mentions.

        - `ephemeral` is allowed on `thought` and `action` only. The next activity from the app
          supersedes an ephemeral one (it stays in the list with `superseded_by_seq`).
        - `signal` is allowed on `elicitation` only: `select` with
          `signal_metadata.options` (1–10), or `auth` with `signal_metadata.url`.
        - `prompt` is human-only: `422 PROMPT_IS_HUMAN_ONLY`.
        - Posting an `action` without `result` and then again with `result` stores two
          activities; both are expected.

        Send an `Idempotency-Key` (at most 64 characters, scoped to the session and the app)
        and keep it across retries: a replay returns the original activity with `201` and
        stores nothing new, whatever the body.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentActivityCreate'
            examples:
              thought:
                value:
                  content:
                    type: thought
                    body: Looking at PUL-123…
              ephemeralAction:
                value:
                  ephemeral: true
                  content:
                    type: action
                    action: Reading
                    parameter: PUL-123
              actionWithResult:
                value:
                  content:
                    type: action
                    action: Searched code
                    parameter: webhook_timestamp
                    result: 3 files match
              selectElicitation:
                value:
                  content:
                    type: elicitation
                    body: Which environment should I deploy to?
                  signal: select
                  signal_metadata:
                    options:
                      - value: staging
                        label: Staging
                      - value: production
                        label: Production
              authElicitation:
                value:
                  content:
                    type: elicitation
                    body: I need access to your GitHub account to open the pull request.
                  signal: auth
                  signal_metadata:
                    url: https://scout.acme.example/connect/github?session=sess_01J9Z3K8T5N2
                    provider_name: GitHub
              response:
                value:
                  content:
                    type: response
                    body: Done. The fix is in https://github.com/acme/app/pull/88.
              error:
                value:
                  content:
                    type: error
                    body: I could not reach the repository. Check the app's GitHub access.
      responses:
        '201':
          description: The stored activity (or the original one, for a replayed `Idempotency-Key`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentActivity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/InsufficientScope'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SessionEnded'
        '422':
          $ref: '#/components/responses/ActivityRejected'
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    AppToken:
      type: http
      scheme: bearer
      description: >-
        An agent app access token (`actor=app`), valid 1 hour, refreshed through
        `POST /api/v1/oauth/token`. Send `X-Workspace-ID` with it.

  parameters:
    WorkspaceId:
      name: X-Workspace-ID
      in: header
      required: true
      description: The installation's workspace (`workspace_id` in the token response).
      schema:
        type: string
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string

  responses:
    Unauthorized:
      description: Missing, invalid, expired or revoked token (`UNAUTHORIZED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Authentication required
    InsufficientScope:
      description: >-
        The token lacks `write` (for POST and PATCH) or `read` (`INSUFFICIENT_SCOPE`).
        `details.required` and `details.granted` list the scopes.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer error="insufficient_scope", scope="write"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INSUFFICIENT_SCOPE
            message: This token is missing a required scope
            details:
              required: [write]
              granted: [read]
    NotFound:
      description: >-
        No such session for this app (`RESOURCE_NOT_FOUND`). Another app's session, and an
        issue or comment the app cannot see, answer the same way.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_FOUND
            message: Resource not found
    SessionEnded:
      description: >-
        The session was ended by a human or by Pulse (`ended_at` and `end_reason` are set) and
        accepts no more writes (`SESSION_ENDED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: SESSION_ENDED
            message: This session has ended
            details:
              end_reason: stopped
    ValidationError:
      description: The body does not match the schema (`VALIDATION_ERROR`); `details` maps each failing field to a message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Validation failed
            details:
              plan[3].status: must be one of pending, inProgress, completed, canceled
    ActivityRejected:
      description: >-
        `PROMPT_IS_HUMAN_ONLY` for `content.type: prompt`; `VALIDATION_ERROR` for anything
        else that does not match the schema (for example `ephemeral` on a `response`, or a
        `signal` on a `thought`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            prompt:
              value:
                code: PROMPT_IS_HUMAN_ONLY
                message: Only people can post prompts
            invalid:
              value:
                code: VALIDATION_ERROR
                message: Validation failed
                details:
                  ephemeral: allowed on thought and action only
    RateLimited:
      description: '`RATE_LIMIT_EXCEEDED`: 10 activities per second per session, or 600 requests per minute per installation.'
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RATE_LIMIT_EXCEEDED
            message: Rate limit exceeded. Please try again later.

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            `UNAUTHORIZED`, `INSUFFICIENT_SCOPE`, `RESOURCE_NOT_FOUND`, `SESSION_ENDED`,
            `PROMPT_IS_HUMAN_ONLY`, `VALIDATION_ERROR` or `RATE_LIMIT_EXCEEDED`.
          example: SESSION_ENDED
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    AgentSessionState:
      type: string
      description: |
        Derived by Pulse from the app's last activity (see the state machine); the app never
        sets it directly.

        - `pending`: created, or reopened by a human prompt; nothing from the app yet.
        - `active`: the last app activity was a `thought` or an `action`.
        - `awaitingInput`: the last app activity was an `elicitation`.
        - `error`: the last app activity was an `error`.
        - `complete`: the last app activity was a `response`, or Pulse ended the session.
        - `stale`: 30 minutes passed in `pending` or `active` with no app activity.
          Recoverable: any app activity or human prompt moves it on.
        - `stopping`: a human pressed Stop, or the issue was undelegated; see `end_reason`.
          The app's next `response` or `error`, or 60 seconds, ends it as `complete`.
      enum: [pending, active, awaitingInput, error, complete, stale, stopping]

    AgentSessionEndReason:
      type: [string, 'null']
      description: |
        Why a human or Pulse is ending, or ended, the session rather than the app. For
        `stopped` and `undelegated` it is set as soon as the session enters `stopping`, so
        the app knows why it is being stopped; `uninstalled`, `team_removed` and
        `issue_deleted` end the session at once, with no `stopping` and no `prompted`.
        `ended_at` is set when the session actually ends. Null otherwise. Once the session has
        ended with one of these, app writes answer `409 SESSION_ENDED`.

        - `stopped`: a human pressed Stop.
        - `undelegated`: the issue was undelegated or delegated to another agent.
        - `uninstalled`: the app was uninstalled.
        - `team_removed`: the installation no longer covers the issue's team.
        - `issue_deleted`: the issue was deleted.
      enum: [stopped, undelegated, uninstalled, team_removed, issue_deleted, null]

    PlanItem:
      type: object
      required: [content, status]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 500
          example: Read the issue and its threads
        status:
          type: string
          enum: [pending, inProgress, completed, canceled]

    ExternalUrl:
      type: object
      required: [label, url]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
          example: Open in Scout
        url:
          type: string
          format: uri
          pattern: '^https://'
          description: Unique within a session.
          example: https://scout.acme.example/runs/42

    Person:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
          example: Sara Ahmadi

    AgentSession:
      type: object
      description: >-
        An agent session as an app sees it. Identical to `AgentSession` in pulse-api's app
        webhook payloads (`agent_session`).
      required:
        - id
        - state
        - unresponsive_since
        - issue
        - comment
        - creator
        - app_user_id
        - plan
        - external_urls
        - created_at
        - updated_at
        - ended_at
        - end_reason
      properties:
        id:
          type: string
          example: sess_01J9Z3K8T5N2
        state:
          $ref: '#/components/schemas/AgentSessionState'
        unresponsive_since:
          type: [string, 'null']
          format: date-time
          description: >-
            Set when neither an app activity nor an external URL arrived within 10 seconds of
            creation; cleared by the first one.
        issue:
          type: [object, 'null']
          description: The issue the session works on. Null for a mention on a project comment.
          required: [id, identifier, title, url, team]
          properties:
            id:
              type: string
            identifier:
              type: string
              description: The issue code.
              example: PUL-123
            title:
              type: string
            url:
              type: string
              format: uri
            team:
              type: object
              required: [id, key, name]
              properties:
                id:
                  type: string
                key:
                  type: string
                  description: The team's issue key prefix.
                  example: PUL
                name:
                  type: string
        comment:
          type: [object, 'null']
          description: The comment that opened a mention session. Null for a delegation session.
          required: [id, body, url]
          properties:
            id:
              type: string
            body:
              type: string
              description: Markdown.
            url:
              type: string
              format: uri
        creator:
          $ref: '#/components/schemas/Person'
          description: The human who delegated or mentioned the app. For a session the app created itself, the app user.
        app_user_id:
          type: string
        plan:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PlanItem'
        external_urls:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ExternalUrl'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ended_at:
          type: [string, 'null']
          format: date-time
          description: Set when the session ended with an `end_reason`.
        end_reason:
          $ref: '#/components/schemas/AgentSessionEndReason'

    AgentSessionPage:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentSession'
        next_cursor:
          type: [string, 'null']
          description: Pass as `cursor` for the next page; null on the last page.

    AgentSessionCreate:
      type: object
      description: Exactly one of `issue_id` or `comment_id`.
      oneOf:
        - required: [issue_id]
        - required: [comment_id]
      properties:
        issue_id:
          type: string
        comment_id:
          type: string

    AgentSessionUpdate:
      type: object
      description: >-
        Only the fields sent change. `external_urls` cannot be combined with
        `added_external_urls` or `removed_external_urls`.
      minProperties: 1
      additionalProperties: false
      properties:
        plan:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PlanItem'
        external_urls:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ExternalUrl'
        added_external_urls:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/ExternalUrl'
        removed_external_urls:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
          description: The `url`s to remove.

    ThoughtContent:
      type: object
      required: [type, body]
      properties:
        type:
          type: string
          const: thought
        body:
          type: string
          minLength: 1
          description: Markdown.
    ActionContent:
      type: object
      required: [type, action, parameter]
      properties:
        type:
          type: string
          const: action
        action:
          type: string
          minLength: 1
          description: What the app is doing, e.g. `Reading` or `Searched code`.
        parameter:
          type: [string, 'null']
          description: What it acts on, e.g. an issue identifier or a query. May be null.
        result:
          type: string
          description: The outcome. Omit while the action is still running.
    ElicitationContent:
      type: object
      required: [type, body]
      properties:
        type:
          type: string
          const: elicitation
        body:
          type: string
          minLength: 1
          description: The question for the human. Markdown.
    ResponseContent:
      type: object
      required: [type, body]
      properties:
        type:
          type: string
          const: response
        body:
          type: string
          minLength: 1
          description: The result of the work. Markdown.
    ErrorContent:
      type: object
      required: [type, body]
      properties:
        type:
          type: string
          const: error
        body:
          type: string
          minLength: 1
          description: What went wrong and what a human can do. Markdown.
    PromptContent:
      type: object
      description: A human's message. Read-only; apps cannot post it.
      required: [type, body]
      properties:
        type:
          type: string
          const: prompt
        body:
          type: string
          description: Markdown. For an answer to a `select` elicitation, the chosen option's `value` or free text.

    SelectSignalMetadata:
      type: object
      required: [options]
      properties:
        options:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [value]
            properties:
              value:
                type: string
                description: Sent back as the prompt body when chosen.
              label:
                type: string
                description: Shown on the button; defaults to `value`.
    AuthSignalMetadata:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
          description: Where the human connects their account. Opened in a new tab.
        user_id:
          type: string
          description: Only this Pulse user sees the link.
        provider_name:
          type: string
          description: Shown as "Connect ‹provider_name›".
          example: GitHub

    AgentActivityCreate:
      type: object
      required: [content]
      properties:
        content:
          oneOf:
            - $ref: '#/components/schemas/ThoughtContent'
            - $ref: '#/components/schemas/ActionContent'
            - $ref: '#/components/schemas/ElicitationContent'
            - $ref: '#/components/schemas/ResponseContent'
            - $ref: '#/components/schemas/ErrorContent'
          discriminator:
            propertyName: type
            mapping:
              thought: '#/components/schemas/ThoughtContent'
              action: '#/components/schemas/ActionContent'
              elicitation: '#/components/schemas/ElicitationContent'
              response: '#/components/schemas/ResponseContent'
              error: '#/components/schemas/ErrorContent'
        ephemeral:
          type: boolean
          default: false
          description: '`thought` and `action` only. The next app activity supersedes it.'
        signal:
          type: string
          enum: [select, auth]
          description: '`elicitation` only. `stop` is a human signal and cannot be sent.'
        signal_metadata:
          description: Required with `signal`.
          oneOf:
            - $ref: '#/components/schemas/SelectSignalMetadata'
            - $ref: '#/components/schemas/AuthSignalMetadata'

    AgentActivityAuthor:
      type: object
      required: [kind, id, name, avatar_url]
      properties:
        kind:
          type: string
          enum: [app, user]
          description: '`app` for the app''s activities, `user` for human prompts.'
        id:
          type: string
        name:
          type: string
        avatar_url:
          type: [string, 'null']
          format: uri

    AgentActivity:
      type: object
      required:
        - id
        - seq
        - type
        - content
        - ephemeral
        - superseded_by_seq
        - signal
        - signal_metadata
        - author
        - created_at
      properties:
        id:
          type: string
        seq:
          type: integer
          minimum: 1
          description: Monotonic within the session, with gaps.
        type:
          type: string
          enum: [thought, action, elicitation, response, error, prompt]
        content:
          oneOf:
            - $ref: '#/components/schemas/ThoughtContent'
            - $ref: '#/components/schemas/ActionContent'
            - $ref: '#/components/schemas/ElicitationContent'
            - $ref: '#/components/schemas/ResponseContent'
            - $ref: '#/components/schemas/ErrorContent'
            - $ref: '#/components/schemas/PromptContent'
          discriminator:
            propertyName: type
            mapping:
              thought: '#/components/schemas/ThoughtContent'
              action: '#/components/schemas/ActionContent'
              elicitation: '#/components/schemas/ElicitationContent'
              response: '#/components/schemas/ResponseContent'
              error: '#/components/schemas/ErrorContent'
              prompt: '#/components/schemas/PromptContent'
        ephemeral:
          type: boolean
        superseded_by_seq:
          type: [integer, 'null']
          description: Set on an ephemeral activity once a later app activity replaced it.
        signal:
          type: [string, 'null']
          enum: [stop, select, auth, null]
          description: '`stop` on a human prompt; `select` or `auth` on an app elicitation.'
        signal_metadata:
          oneOf:
            - $ref: '#/components/schemas/SelectSignalMetadata'
            - $ref: '#/components/schemas/AuthSignalMetadata'
            - type: 'null'
        author:
          $ref: '#/components/schemas/AgentActivityAuthor'
        created_at:
          type: string
          format: date-time

    AgentActivityPage:
      type: object
      required: [data, has_more, last_seq]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AgentActivity'
        has_more:
          type: boolean
          description: True when more activities follow; request again with `after_seq=last_seq`.
        last_seq:
          type: integer
          minimum: 0
          description: The `seq` of the last activity returned, or the `after_seq` sent when the page is empty.

    PromptedActivity:
      type: object
      description: >-
        `agent_activity` of `AgentSessionEvent` / `prompted` (delivered by pulse-api; built by
        pulse-agent). Identical to pulse-api's `PromptedActivity`. `signal: stop` means the
        human pressed Stop: do nothing further and post a final `response` or `error`.
      required: [id, content, author, created_at]
      properties:
        id:
          type: string
        content:
          $ref: '#/components/schemas/PromptContent'
        signal:
          type: string
          enum: [stop]
        author:
          $ref: '#/components/schemas/Person'
        created_at:
          type: string
          format: date-time

    PromptContext:
      type: string
      maxLength: 65536
      description: |
        `prompt_context` of `AgentSessionEvent` / `created` (normative). XML using Linear's
        tags, built by pulse-agent; the same data is also sent as the structured fields
        `agent_session`, `previous_comments` and `guidance`.

        - `<issue identifier="…" url="…">` containing `<title>`, `<description>` (Markdown
          converted from the issue's document), `<team>`, `<label>` (repeated), `<project>` and
          `<parent-issue>` (each only when set).
        - `<primary-directive-thread comment-id="…">` — the thread that mentioned the app — and
          `<other-thread comment-id="…">` for the issue's other threads, each containing
          `<comment author="…" created-at="…">`. A delegation has no primary thread.
        - `<guidance>` containing `<guidance-rule origin="workspace">`, then
          `<guidance-rule origin="team" team="KEY">`. The team rule wins on conflict. Global
          platform guidance and personal guidance are never included.
        - `<repository-hint repository="group/project"/>`, repeated, only from the issue team's
          routing hints. A hint, not access: the app brings its own git credentials.

        At most 64 KB: the oldest `<other-thread>` blocks are dropped first, then
        `<description>` is truncated.
      example: |
        <issue identifier="PUL-123" url="https://app.trypulse.tech/pulse/issues/6ab5b0024f48187cbd3ce990">
          <title>Webhook retries ignore Retry-After</title>
          <description>Deliveries that get a 429 retry on the fixed schedule.</description>
          <team>Pulse</team>
          <label>bug</label>
          <project>Integrations</project>
        </issue>
        <primary-directive-thread comment-id="6ab5b0414f48187cbd3ce9b2">
          <comment author="Sara Ahmadi" created-at="2026-09-25T09:12:03.120Z">@Scout can you look at this?</comment>
        </primary-directive-thread>
        <guidance>
          <guidance-rule origin="workspace">Write in English. Link every issue you mention.</guidance-rule>
          <guidance-rule origin="team" team="PUL">Never touch the billing module.</guidance-rule>
        </guidance>
        <repository-hint repository="pulse/pulse-api"/>
